<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Web2API — 网站收录查询开放平台">
  <defs>
    <linearGradient id="bgFog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF2EC"/>
      <stop offset="1" stop-color="#F5F8F5"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C9268"/>
      <stop offset="1" stop-color="#177E5B"/>
    </linearGradient>
    <filter id="tileShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#177E5B" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bgFog)"/>

  <g opacity="0.5" fill="none" stroke="#177E5B" stroke-width="1.4">
    <path d="M-20 330 C 180 300, 320 356, 520 322 S 900 288, 1300 330" opacity="0.5"/>
    <path d="M-20 360 C 200 326, 360 380, 560 350 S 920 314, 1300 358" opacity="0.35"/>
    <path d="M-20 390 C 220 352, 400 402, 620 376 S 960 344, 1300 386" opacity="0.22"/>
  </g>

  <g transform="translate(640, 150)" text-anchor="middle">
    <g transform="translate(-206, -44)" filter="url(#tileShadow)">
      <rect width="88" height="88" rx="20" fill="url(#tile)"/>
      <path d="M10 70 L32 34 L44 52 L58 36 L78 70 Z" fill="#FFFFFF"/>
      <circle cx="57" cy="24" r="6" fill="#FFFFFF"/>
    </g>
    <text x="60" y="0" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="1" fill="#1A2B24">Web2API</text>
    <text x="62" y="34" text-anchor="start" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" fill="#5E7265">网站收录查询开放平台</text>
  </g>

  <g transform="translate(640, 268)" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#3C5548" font-weight="500">
    <text x="0" y="0">提交一批 URL,一次判定百度 / 搜狗 / 360 搜索 / 必应是否收录</text>
  </g>

  <g transform="translate(640, 322)" text-anchor="middle" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13">
    <g transform="translate(-292, 0)">
      <rect width="104" height="34" rx="17" fill="#FFFFFF" stroke="#B4C9BB"/>
      <text x="52" y="22" fill="#1A2B24" font-weight="600">百度 BAIDU</text>
    </g>
    <g transform="translate(-168, 0)">
      <rect width="104" height="34" rx="17" fill="#FFFFFF" stroke="#B4C9BB"/>
      <text x="52" y="22" fill="#1A2B24" font-weight="600">搜狗 SOGOU</text>
    </g>
    <g transform="translate(-44, 0)">
      <rect width="112" height="34" rx="17" fill="#FFFFFF" stroke="#B4C9BB"/>
      <text x="56" y="22" fill="#1A2B24" font-weight="600">360 SO360</text>
    </g>
    <g transform="translate(88, 0)">
      <rect width="104" height="34" rx="17" fill="#FFFFFF" stroke="#B4C9BB"/>
      <text x="52" y="22" fill="#1A2B24" font-weight="600">必应 BING</text>
    </g>
    <g transform="translate(212, 0)">
      <rect width="112" height="34" rx="17" fill="#FFFFFF" stroke="#B4C9BB"/>
      <text x="56" y="22" fill="#1A2B24" font-weight="600">MCP · OpenAPI</text>
    </g>
  </g>
</svg>
