# Standalone deployment for this checkout (does not depend on the upstream compose file).
#
#   docker compose -f deploy/docker-compose.yml up -d --build   # build + start
#   docker compose -f deploy/docker-compose.yml ps              # status
#   docker compose -f deploy/docker-compose.yml down            # stop
#
# Serves the panel + API on http://127.0.0.1:7000/web-tool/ (loopback only).
#
# The whole app lives under the fixed /web-tool sub-path: panel at /web-tool/,
# public API at /web-tool/v1/*, Agent plane at /web-tool/mcp (+ /web-tool/openapi.yaml
# and /web-tool/llms.txt), admin API at /web-tool/api/*, probes at /web-tool/health —
# there is no root mounting and no config switch for it.
# Data (API keys, usage journal, JWT secret) persists in the container path
# /usr/src/app/data; mount a volume if you need it to survive recreation.
#
# Engine stability (stability.engine_cooldown) and control-plane security
# (security.login_lockout / security.admin_rate_per_minute) are read from the
# mounted ../config.yaml — keys and defaults are documented in its comment
# block and docs/CONFIGURATION.md. No compose-level overrides are needed; to
# inject the 2captcha solver key without editing config.yaml, add:
#   environment:
#     WEB2API_2CAPTCHA_APIKEY: "<key>"
# (only effective when the 2captcha: block exists in config.yaml — see its comment).
name: web2api-local

services:
  web2api:
    init: true
    # Chrome needs more than the default 64MB /dev/shm. 2gb is safe on normal hosts;
    # on 1.4GB-RAM servers use 512mb (launch already passes --disable-dev-shm-usage).
    shm_size: 512mb
    image: web2api:local
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:7000:7000"
    command: serve
    volumes:
      - ../config.yaml:/usr/src/app/config.yaml:ro
      # Persist API keys / usage / JWT secret across container recreation.
      - web2api-data:/usr/src/app/data
    environment:
      WEB2API_SERVER_HOST: "0.0.0.0"
      WEB2API_SERVER_PORT: 7000
      # REQUIRED. The container must bind 0.0.0.0 to be reachable through the
      # port mapping, and the server refuses to start on a non-loopback bind
      # while platform.admin_password is still the public default (see
      # docs/audit/FINDINGS.md F-26). Provide a strong password here:
      #   ADMIN_PASSWORD='...' docker compose -f deploy/docker-compose.yml up -d
      # or set platform.admin_password in the mounted ../config.yaml. The ":?"
      # form makes a missing value an immediate error instead of a restart loop.
      WEB2API_PLATFORM_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD to a strong admin password before 'docker compose up'}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:7000/web-tool/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  web2api-data:
