      responses:
        "200":
          description: 清理完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  removed_serve: { type: integer, example: 3 }
                  removed_audit: { type: integer, example: 2 }
        "401":
          description: JWT 缺失/过期(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
