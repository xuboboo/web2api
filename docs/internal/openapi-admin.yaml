    delete:
      tags: [admin]
      operationId: deleteUser
      summary: 删除用户(JWT, admin)
      description: 最小角色 admin;不能删除当前登录账号或最后一名 active admin;删除会撤销其会话。
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean, example: true } } }
        "400":
          description: 参数非法(INVALID_PARAM,中文 message)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformBadRequest" }
        "401":
          description: JWT 缺失/过期(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "403":
          description: 角色不足(insufficient_role)或命中 IP/CIDR 黑名单(blacklisted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForbiddenError" }
        "404":
          description: 资源不存在(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: not_found }

  /api/users/{id}/password:
    post:
      tags: [admin]
      operationId: resetUserPassword
      summary: 重置指定用户密码(JWT, admin)
      description: |
        最小角色 admin;新密码需满足 security.password_policy。成功后只撤销该用户会话。
        管理员自助改密走 /api/auth/password,仍沿用 token_version 全局失效契约。
