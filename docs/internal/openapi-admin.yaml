  /api/logs/cleanup:
    post:
      tags: [admin]
      operationId: cleanupLogs
      summary: 手动清理过期滚动日志(JWT, admin)
      description: |
        最小角色 admin。按 mtime 删除超过 app.log_retention_days 的 logs.txt.N 与 audit.log.N,
        不删除当前日志文件;过期黑名单规则不会被清理。
      security:
