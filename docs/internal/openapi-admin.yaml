# ============================================================
# 内部文档 — Web2API 控制平面(/api/*)完整 OpenAPI 规范
# 仓库内供维护者查阅，不嵌入运行服务。
# mcp/openapi.yaml 是公开接口契约。更新共享端点时同步维护两份，管理端点只在此定义。
# ============================================================
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Web2API — 网站收录查询开放平台
  version: "0.8.19"
  license:
    name: MIT
    url: https://github.com/xuboboo/web2api/blob/main/LICENSE
  description: |
    单二进制自托管的「Web2API 网站收录查询开放平台」。

    三个平面:
    * **数据平面** `/v1/*` — 国内四引擎(百度/搜狗/360/必应)收录判定与搜索,鉴权/配额/限流/冷却内建。
    * **Agent 平面** `/mcp` + 本 spec + `llms.txt` — AI Agent 可直接调用(MCP streamable HTTP,JSON-RPC 2.0)。
    * **控制平面** `/api/*` — 管理面板后台(风控与用量治理台)。

    ## 三套错误信封
    1. **平台信封**(`/v1/*`、`/mcp` 鉴权与配额):`{"error":"unauthorized|quota_exceeded|..."}`。配额或访问限流返回 429 和 `Retry-After`。
    2. **数据面信封**(`/{engine}/search` 等核心端点):`{"error":"<code>","code":<http状态>,"request_id":"...","message":"...","reason":"...","meta":{}}`。
    3. **JSON-RPC 信封**(`/mcp`):`{"jsonrpc":"2.0","id":1,"error":{"code":-32602,"message":"..."}}`。

    ## 引擎冷却(风控)
    引擎返回 blocked(403)/429/captcha 会进入冷却状态机:第 1 次冷却 10 分钟、第 2 次 30 分钟、第 3 次及以上 120 分钟;
    随仓库提供的配置将百度的三档覆盖为 2、10、30 分钟。正常批次结束后没有额外冷却，后续请求仍受引擎限流。
    连续无拦截达 `stability.engine_cooldown.reset_after_minutes`（默认 240）后计数归零。
    同步请求开始时，所选引擎全部冷却才返回 503。其余情况查看响应中逐单元的错误，或异步任务的 `waiting` 状态。
    503 `engine_cooldown` 响应携带 `Retry-After`。可通过 `/engines/status` 查看当前各引擎状态。

    ## 限流
    HTTP 429 响应携带 `Retry-After`（秒）。API Key 默认每分钟 120 个请求，设置项为
    `security.api_rate_per_minute`。访问限速返回 `429 {"error":"rate_limited"}`。

    ## 角色(最小权限)
    固定三种角色 `admin > operator > viewer`,按持久化用户记录逐请求校验(角色/状态变更立即生效);
    GET 读取端点 + `/api/playground/check` + `/api/auth/{password,logout,refresh}` 需 viewer;
    API key 增删改/轮换、引擎冷却 reset/force、黑名单管理需 operator;
    用户管理 `/api/users*`、会话撤销、备份下载、`/api/logs/cleanup` 需 admin。
    角色不足 `403 {"error":"forbidden","code":"insufficient_role"}`;
    黑名单命中 `403 {"error":"forbidden","reason":"blacklisted"}`(全站前置中间件,先于所有路由与其它中间件)。
    `platform.admin_username`/`admin_password` 仅首启迁移进用户库,之后用户库为唯一事实来源;
    不含 uid/role 声明的旧 JWT 按 sub 查用户库并按当前角色与状态逐请求校验；
    仅用户库为空才回退 bootstrap admin；MCP JWT 必须含 sid 且角色为 admin。用户状态取 active/disabled。

    ## 日志与黑名单
    `app.log_retention_days`(默认 30,0=仅按份数保留)在启动、轮转后与每 12 小时按 mtime 删除
    过期的 `logs.txt.N` / `audit.log.N`;`GET /api/logs*` 只读查询(日志行为不可信诊断数据,不执行),
    `POST /api/logs/cleanup` 手动清理。`security.blacklist` 仅首启种子 IP/CIDR,之后走控制台/API;
    过期规则只被忽略,不会被日志清理删除。
servers:
  - url: https://your-host/web-tool
    description: 自托管部署根(替换为你的域名;Dify/n8n/LangChain 导入要求域名格式,禁用 IP)
tags:
  - name: data-plane
    description: 数据平面 — 收录判定与搜索(/v1/*,/{engine}/search)
  - name: agent-plane
    description: Agent 平面 — MCP 与静态资源(/mcp、openapi.yaml、llms.txt)
  - name: admin
    description: 控制平面 — 管理面板后台(/api/*);按最小角色 viewer/operator/admin 守卫
  - name: ops
    description: 运维 — 健康/就绪/运行统计

paths:
  /metrics:
    get:
      tags: [ops]
      operationId: scrapeMetrics
      summary: OpenMetrics 指标
      description: 配置 security.metrics_token 时需要专用 Bearer token，未配置时只允许回环客户端。
      security: [{ MetricsTokenAuth: [] }, {}]
      responses:
        "200":
          description: OpenMetrics 文本
          content:
            text/plain:
              schema: { type: string }
        "401": { description: 专用 token 缺失或无效。 }
        "403": { description: 仅允许回环访问或来源被访问策略拒绝。 }

  /stats/cb:
    get:
      tags: [ops]
      operationId: getCircuitBreakerStats
      summary: 引擎熔断统计
      description: 鉴权条件同 /stats。
      security: [{ ApiKeyAuth: [] }, {}]
      responses:
        "200":
          description: 各引擎熔断快照
          content:
            application/json:
              schema:
                type: object
                properties:
                  circuit_breakers: { type: array, items: { type: object } }
        "401": { description: 所需 API Key 缺失或无效。 }
        "403": { description: 来源被访问策略拒绝。 }

  /stats/proxy:
    get:
      tags: [ops]
      operationId: getProxyStats
      summary: 代理池统计
      description: 鉴权条件同 /stats。
      security: [{ ApiKeyAuth: [] }, {}]
      responses:
        "200":
          description: 代理统计对象
          content:
            application/json:
              schema: { type: object }
        "401": { description: 所需 API Key 缺失或无效。 }
        "403": { description: 来源被访问策略拒绝。 }

  /stats/cache:
    get:
      tags: [ops]
      operationId: getCacheStats
      summary: 响应缓存统计
      description: 鉴权条件同 /stats。
      security: [{ ApiKeyAuth: [] }, {}]
      responses:
        "200":
          description: 缓存统计对象
          content:
            application/json:
              schema: { type: object }
        "401": { description: 所需 API Key 缺失或无效。 }
        "403": { description: 来源被访问策略拒绝。 }

  /engines/status:
    get:
      tags: [ops]
      operationId: getEngineStatus
      summary: 公开引擎状态
      description: 返回已注册引擎的冷却和熔断快照，缓存 5 秒。该端点只读状态，不执行搜索。
      responses:
        "200":
          description: 引擎状态快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineStatusSnapshot" }

  /health:
    get:
      tags: [ops]
      operationId: healthCheck
      summary: 健康检查
      description: 公开健康探针。healthy 和 degraded 返回 200，所有引擎不可用时返回 503 unhealthy。
      responses:
        "200":
          description: 引擎健康快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthSnapshot" }
        "503":
          description: 没有可用引擎。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthSnapshot" }

  /ready:
    get:
      tags: [ops]
      operationId: readyCheck
      summary: 就绪检查
      description: 排水中返回 503,可挂负载均衡探针。
      responses:
        "200":
          description: 就绪
          content:
            application/json:
              schema: { type: object, properties: { status: { const: ready } }, required: [status] }
        "503":
          description: 排水中，暂不接收新流量。
          content:
            application/json:
              schema: { type: object, properties: { status: { const: draining } }, required: [status] }

  /stats:
    get:
      tags: [ops]
      operationId: getStats
      summary: 运行统计
      description: 运行统计。配置模板默认需要 API Key，关闭 security.data_plane_auth 后可匿名读取。
      security: [{ ApiKeyAuth: [] }, {}]
      responses:
        "200":
          description: 统计快照
          content:
            application/json:
              schema:
                type: object
                properties:
                  cache:
                    type: object
                  proxy:
                    type: object
                  circuit_breakers:
                    type: array
                    items:
                      type: object
                  captcha:
                    type: object
        "401":
          description: 所需 API Key 缺失或无效。
        "403":
          description: 来源被访问策略拒绝。

  /{engine}/search:
    get:
      tags: [data-plane]
      operationId: searchEngine
      summary: 单引擎 SERP 搜索(鉴权随部署方 security.data_plane_auth;不计费)
      description: |
        走浏览器渲染或 raw HTTP 管道的单引擎搜索。`engine` 取值:`baidu`、`sogou`、`so360`(亦可用 `360`)、`bing`。

        响应 `meta.engines_cooldown` 携带冷却中的引擎;该引擎请求快速失败:
        `503 {"error":"engine_cooldown","reason":"COOLDOWN","retry_after_seconds":N}` + `Retry-After`。
        鉴权随部署方 security.data_plane_auth:模板默认 true 需 X-API-Key;置 false 时免鉴权。不计费。
      security: [{ ApiKeyAuth: [] }, {}]
      parameters:
        - name: engine
          in: path
          required: true
          schema:
            type: string
            enum: [baidu, sogou, so360, "360", bing]
          example: baidu
        - name: text
          in: query
          required: true
          description: 搜索关键词
          schema:
            type: string
            minLength: 1
          example: golang fiber 教程
        - name: limit
          in: query
          description: 返回条数(1..100,默认 10)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: start
          in: query
          description: 翻页偏移
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: lang
          in: query
          description: 语言提示(如 EN/DE/中文引擎忽略)
          schema:
            type: string
        - name: region
          in: query
          description: 市场地区提示
          schema:
            type: string
        - name: file
          in: query
          description: 文件类型过滤(pdf/docx/…)
          schema:
            type: string
        - name: site
          in: query
          description: 站内限定(domain)
          schema:
            type: string
        - name: date
          in: query
          description: 日期范围提示，支持情况由所选引擎决定。
          schema: { type: string }
        - name: filter
          in: query
          description: 搜索过滤开关，默认启用。
          schema: { type: string, enum: ["1", "0", "true", "false"], default: "1" }
        - name: features
          in: query
          description: 是否解析 SERP 特性模块，默认启用。
          schema:
            type: string
            enum: ["0", "1", "true", "false"]
            default: "1"
        - name: resolve_urls
          in: query
          description: true 解析全部，false 或 0 不解析，正整数 N 仅处理前 N 条自然结果。省略时按服务端配置。
          schema:
            type: string
        - name: format
          in: query
          description: 输出格式。省略时按 Accept 选择，未指定时为 JSON。
          schema: { type: string, enum: [json, markdown, text, ndjson] }
        - name: output
          in: query
          description: 设置为 markdown 时输出 Markdown。
          schema: { type: string, enum: [markdown] }
      responses:
        "200":
          description: 搜索结果信封
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchEnvelope" }
            text/markdown:
              schema: { type: string }
            text/plain:
              schema: { type: string }
            application/x-ndjson:
              schema: { type: string }
        "400":
          description: 参数错误(数据面信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataPlaneError" }
              example:
                error: bad_request
                code: 400
                reason: INVALID_LIMIT
                message: "INVALID_LIMIT: limit must be between 1 and 100"
                request_id: req_9f2c
                meta: {}
        "401":
          description: 数据面要求鉴权，密钥缺失或无效。
        "403":
          description: 访问策略拒绝请求，或引擎返回 blocked。
        "429":
          description: 引擎侧拦截/验证码(数据面信封)+ Retry-After
          headers:
            Retry-After:
              description: 建议重试等待秒数
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataPlaneError" }
              examples:
                captcha:
                  value:
                    error: captcha_detected
                    code: 429
                    reason: CAPTCHA
                    message: captcha detected
                    request_id: req_9f2c
                    meta: { engine: baidu }
        "503":
          description: 引擎冷却中(契约 A)或代理不可用
          headers:
            Retry-After:
              description: 冷却剩余秒数
              schema: { type: integer }
          content:
            application/json:
              examples:
                engine_cooldown:
                  value:
                    error: engine_cooldown
                    reason: COOLDOWN
                    retry_after_seconds: 600
                proxy_unavailable:
                  value:
                    error: proxy_unavailable
                    code: 503
                    reason: PROXY_UNAVAILABLE
                    message: proxy unavailable
                    request_id: req_9f2c
                    meta: {}

  /v1/index/check:
    get:
      tags: [data-plane]
      operationId: checkIndexSingle
      summary: 单 URL 收录判定(X-API-Key)
      description: |
        查询单个 URL 在所选引擎中的可检索性，按成功引擎扣费。
        若所选引擎全部已冷却，返回 503。其余引擎级失败记入对应单元的 `error` 字段，HTTP 状态为 200。
      security:
        - ApiKeyAuth: []
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri }
          example: https://example.com/post/123
        - name: engines
          in: query
          description: 逗号分隔引擎列表，省略时使用全部可用引擎。360 是 so360 的别名。
          schema: { type: string }
          example: baidu,bing
      responses:
        "200":
          description: 收录判定结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexCheckResponse" }
        "400":
          description: URL 或引擎参数非法。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataPlaneError" }
        "401":
          description: 缺失/无效/禁用的 key(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "403":
          description: 调用方 IP 不在该密钥的允许范围内。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: forbidden }
        "429":
          description: 日配额超限或接口访问限流，携带 Retry-After。
          headers:
            Retry-After: { description: 重试等待秒数, schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: quota_exceeded }
        "503":
          description: 目标引擎全部处于冷却期(契约 A)+ Retry-After
          headers:
            Retry-After: { description: 冷却剩余秒数, schema: { type: integer } }
          content:
            application/json:
              example:
                error: engine_cooldown
                reason: COOLDOWN
                retry_after_seconds: 600
    post:
      tags: [data-plane]
      operationId: checkIndexBatch
      summary: 批量收录判定(X-API-Key;≤20 同步,>20 转异步任务)
      description: |
        批量检测 URL，上限由 `index_jobs.max_urls` 决定，默认 5000。省略引擎时使用所有可用引擎。
        配额按提交 URL 条数 × 计费引擎数预检。同步仅扣成功单元，未命中也计费。异步在 202 时按提交单元扣费，重复 URL 也计入。

        * `urls` ≤ 20：同一引擎按 URL 顺序逐条执行，不同引擎可并行。整批完成后一次返回 JSON，无逐条响应。
          百度默认每分钟 5 次、突发 1，20 条约需 4 分钟，实际耗时受响应和重试影响。
        * `urls` > 20 且开启 `index_jobs`:返回 **202** + `job_id`;之后用
          `GET /v1/index/check/jobs/{id}` 查进度、`/results` 取结果(可 `?format=csv`)。
        * 未开启任务队列时 > 20 返回 400 `TOO_MANY_URLS`。

        同步批次开始时若所选引擎全部已冷却，请求返回 503。若部分已冷却或批次执行中触发冷却，
        冷却期间跳过的单元在 200 响应中携带 `error.code=engine_cooldown` 和 `error.retry_after_seconds`。
        响应的 `meta.engines_cooldown` 列出仍在冷却中的引擎。
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  items: { type: string, format: uri }
                  minItems: 1
                  description: 同步阈值按原始条数判断。异步默认最多 5000 条唯一字符串，可由服务配置调整。
                  example: ["https://example.com/a", "https://example.com/b"]
                engines:
                  type: array
                  description: 省略时使用全部可用引擎。360 是 so360 的别名。
                  items: { type: string, enum: [baidu, sogou, so360, "360", bing] }
                  example: [baidu]
      responses:
        "200":
          description: 批量收录判定结果(≤20 条)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexCheckResponse" }
              example:
                id: "01a21186-3b1d-7979-92fb-436bef7e5b4f"
                created_at: "2026-11-25T07:05:39Z"
                results:
                  - url: https://example.com/post-1
                    engines:
                      baidu: { indexed: true, match: exact, matched_result_url: "https://example.com/post-1", total_results: 9, took_ms: 2393 }
                  - url: https://example.com/post-2
                    engines:
                      baidu: { indexed: false, match: none, matched_result_url: "", total_results: 8, took_ms: 12020 }
                meta: { request_id: "01a21186-3b1d-7979-92fb-436bef7e5b4f", took_ms: 14413, units: 2 }
        "202":
          description: 批量已入队(>20 条);用 job_id 轮询进度与结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexJobAccepted" }
              example:
                job_id: job_20261124T054613_379221272c
                status: queued
                total: 800
                engines: [baidu]
                created_at: "2026-11-24T05:46:13Z"
                poll_url: /web-tool/v1/index/check/jobs/job_20261124T054613_379221272c
                results_url: /web-tool/v1/index/check/jobs/job_20261124T054613_379221272c/results
                csv_url: /web-tool/v1/index/check/jobs/job_20261124T054613_379221272c/results?format=csv
                note: queued; the server drains this batch at the engine's safe pace.
        "400":
          description: 参数错误（核心信封，reason 为 EMPTY_QUERY、TOO_MANY_URLS 或 INVALID_PARAM 等）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataPlaneError" }
              example:
                error: bad_request
                code: 400
                request_id: req_9f2c
                message: "TOO_MANY_URLS: urls accepts at most 5000 entries per job, got 5001"
                reason: TOO_MANY_URLS
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "403":
          description: 调用方 IP 不在该密钥的允许范围内。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: forbidden }
        "429":
          description: 日配额超限或接口访问限流，携带 Retry-After。
          headers:
            Retry-After: { description: 重试等待秒数, schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              examples:
                quota: { value: { error: quota_exceeded, retry_after_seconds: 3600 } }
                rate: { value: { error: rate_limited, retry_after_seconds: 5 } }
        "503":
          description: 同步批次所选引擎全部在冷却，或异步队列已满、服务正在停止。
          headers:
            Retry-After: { description: 重试等待秒数, schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataPlaneError" }
              examples:
                cooldown:
                  value: { error: engine_cooldown, code: 503, reason: COOLDOWN, message: "all requested engines are in cooldown: baidu (retry after 120s)", retry_after_seconds: 120 }
                queueFull:
                  value: { error: job_queue_full, code: 503, reason: JOB_QUEUE_FULL, message: "index job queue is full; retry later", retry_after_seconds: 60 }
                draining:
                  value: { error: server_draining, code: 503, reason: SERVER_DRAINING, message: "server is shutting down; retry later", retry_after_seconds: 5 }

  /v1/index/check/jobs:
    get:
      tags: [data-plane]
      operationId: listIndexJobs
      summary: 异步收录任务列表(X-API-Key;不计费)
      description: |
        按创建时间倒序返回任务(内存中的运行任务 + 落盘的历史任务)。
        后台同一时刻只执行一个任务,其余 FIFO 排队;这里可用来确认排队位置与整体进度。
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
          description: 返回条数
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              example:
                count: 1
                jobs:
                  - job_id: job_20261124T054613_379221272c
                    status: running
                    progress: 0.66
                    total: 800
                    completed: 530
                    indexed: 210
                    not_indexed: 320
                    failed: 0
                    eta_seconds: 3240
                    interval_ms: 12000
                    engines: [baidu]
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }

  /v1/index/check/jobs/{id}:
    get:
      tags: [data-plane]
      operationId: getIndexJob
      summary: 查询异步收录任务进度(X-API-Key;不计费)
      description: |
        返回单个任务的进度与统计。`status` 取值 queued/running/waiting/done/cancelled/failed;
        `waiting` 表示引擎正在冷却,`wait_seconds` 是剩余等待时间,任务会在冷却结束后自动继续。
        `eta_seconds` 按该任务的引擎令牌间隔估算,仅供参考。
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: check_index 返回的 job_id
      responses:
        "200":
          description: 任务进度
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexJobView" }
              example:
                job_id: job_20261124T054613_379221272c
                status: running
                progress: 0.66
                total: 800
                completed: 530
                indexed: 210
                not_indexed: 320
                failed: 0
                retrying: 0
                wait_seconds: 0
                eta_seconds: 3240
                interval_ms: 12000
                engines: [baidu]
                created_at: "2026-11-24T05:46:13Z"
                updated_at: "2026-11-24T06:40:02Z"
                poll_url: /web-tool/v1/index/check/jobs/job_20261124T054613_379221272c
                results_url: /web-tool/v1/index/check/jobs/job_20261124T054613_379221272c/results
                csv_url: /web-tool/v1/index/check/jobs/job_20261124T054613_379221272c/results?format=csv
        "404":
          description: 任务不存在
          content:
            application/json:
              example: { error: not_found, code: not_found }
    delete:
      tags: [data-plane]
      operationId: cancelIndexJob
      summary: 取消异步收录任务(X-API-Key;不计费)
      description: |
        取消排队中或运行中的任务;已产出结果的条目保留可读,未执行的 URL 不再查询。
        已结束(done/cancelled/failed)的任务返回 409 conflict。
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 已取消(返回任务进度对象,status=cancelled)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexJobView" }
        "404":
          description: 任务不存在
          content:
            application/json:
              example: { error: not_found, code: not_found }
        "409":
          description: 任务已结束
          content:
            application/json:
              example: { error: conflict, code: conflict }

  /v1/index/check/jobs/{id}/results:
    get:
      tags: [data-plane]
      operationId: getIndexJobResults
      summary: 下载异步收录任务结果(X-API-Key;不计费)
      description: |
        使用提交任务时的 API Key。任务执行期间也可读取已写入的结果，顺序以写入为准。
        默认返回 JSON，`results` 行结构与同步收录接口一致。用 `offset` 和 `limit` 分页。
        `?format=csv` 直接下载 Excel 可打开的表格（UTF-8 BOM + CRLF）。
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, csv], default: json }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 结果行(JSON)或 CSV 文件
          content:
            application/json:
              example:
                job_id: job_20261124T054613_379221272c
                status: done
                total: 30
                offset: 0
                count: 1
                results:
                  - url: https://example.com/post-1
                    engines:
                      baidu: { indexed: true, match: exact, matched_result_url: https://example.com/post-1, total_results: 9, took_ms: 2393 }
            text/csv:
              schema: { type: string }
              example: |
                url,baidu_indexed,baidu_match,baidu_matched_result_url,baidu_total_results,baidu_error
                https://example.com/post-1,true,exact,https://example.com/post-1,9,
        "404":
          description: 任务不存在
          content:
            application/json:
              example: { error: not_found, code: not_found }

  /v1/quota:
    get:
      tags: [data-plane]
      operationId: getQuota
      summary: 查询当前 key 的配额与用量(X-API-Key)
      description: 返回调用密钥的当日用量、配额上限(daily_quota=0 表示不限量)与累计用量。
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: 配额对象(daily_quota=0 表示不限量)
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_id: { type: string, example: key_01H... }
                  name: { type: string, example: seo-bot }
                  daily_quota: { type: integer, example: 1000 }
                  used_today: { type: integer, example: 37 }
                  unlimited: { type: boolean, example: false }
                  used_total: { type: integer, example: 1521 }
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }

  /v1/engines:
    get:
      tags: [data-plane]
      operationId: listPublicEngines
      summary: 引擎列表与熔断状态(X-API-Key)
      description: 返回四个引擎的启用状态、端点地址与熔断器快照,供调用方预判可用性。
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: 引擎快照
          content:
            application/json:
              schema:
                type: object
                properties:
                  engines:
                    type: array
                    items:
                      type: object
                      properties:
                        engine: { type: string, example: baidu }
                        endpoint: { type: string, example: /web-tool/baidu/search }
                        enabled: { type: boolean, example: true }
                        breaker:
                          type: object
                          properties:
                            engine: { type: string }
                            state: { type: string, example: closed }
                            failure_count: { type: integer }
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }

  /api/auth/login:
    post:
      tags: [admin]
      operationId: adminLogin
      summary: 管理员登录(获取 JWT)
      description: |
        凭证错误返回 401。防爆破(契约 B):同一用户名跨 IP 连续 5 次失败锁定 15 分钟
        (`security.login_lockout.fails/minutes`),锁定期间一律
        `429 {"error":"too_many_attempts"}` + `Retry-After`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, example: "******" }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: 管理员 JWT }
                  expires_in: { type: integer, example: 86400 }
                  user:
                    type: object
                    description: role/user_id 为 additive 字段。
                    properties:
                      username: { type: string, example: admin }
                      role: { type: string, enum: [admin, operator, viewer], example: admin }
                      user_id: { type: string, description: 用户 ID }
        "401":
          description: 凭证错误(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "429":
          description: 触发登录锁定 + Retry-After
          headers:
            Retry-After: { description: 锁定剩余秒数, schema: { type: integer } }
          content:
            application/json:
              example: { error: too_many_attempts }

  /api/auth/password:
    post:
      tags: [admin]
      operationId: changePassword
      summary: 修改当前登录账号密码(JWT, viewer+)
      description: |
        新密码 ≥ 8 位并按 security.password_policy 校验。bcrypt 哈希写入用户库并撤销该用户会话。
        仅当操作者是 platform.admin_username 对应的 bootstrap admin 时,另写 settings 桶覆盖 config 默认值、
        token_version+1 并撤销全部会话;其他账号改密不影响他人 JWT。响应返回新签发 token,无需重新登录。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "200":
          description: 修改成功(返回新 token;仅 bootstrap admin 触发全局旧 JWT 失效)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  token: { type: string, description: 新签发 JWT }
                  expires_in: { type: integer, example: 86400 }
                  token_version: { type: integer, example: 2 }
        "400":
          description: 参数错误(新密码过短等)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformBadRequest" }
        "401":
          description: 旧密码错误或未登录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "429":
          description: 管理 API 限速(默认 60 req/min)+ Retry-After
          headers:
            Retry-After: { description: 重试等待秒数, schema: { type: integer } }
          content:
            application/json:
              example: { error: rate_limited }

  /api/me:
    get:
      tags: [admin]
      operationId: adminMe
      summary: 当前管理员概览(JWT)
      description: 返回用户名、role/user_id(字符串 additive 字段)、密钥数量与今日/累计调用次数,面板总览页首屏数据;最小角色 viewer。
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 管理员概览
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string, example: admin }
                  role: { type: string, enum: [admin, operator, viewer], example: admin }
                  user_id: { type: string, description: 用户 ID }
                  keys_count: { type: integer, example: 3 }
                  today_calls: { type: integer, example: 128 }
                  total_calls: { type: integer, example: 4271 }
                  version: { type: string, description: 应用版本号 }
        "401":
          description: JWT 缺失/过期/已失效(改密后)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }

  /api/keys:
    get:
      tags: [admin]
      operationId: listApiKeys
      summary: 列出 API 密钥(JWT,新→旧)
      description: 返回全部密钥的视图(前缀、状态、配额、用量),不包含完整密钥本身。
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 密钥视图数组(不含完整 key)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKeyView" }
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
    post:
      tags: [admin]
      operationId: createApiKey
      summary: 创建 API 密钥(JWT)
      description: 完整 key(`sk-w2a-<32hex>`)仅在创建响应中出现一次,存储只留哈希。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: seo-bot }
                daily_quota: { type: integer, minimum: 0, description: 0 = 不限量 }
      responses:
        "200":
          description: 创建成功(含一次性完整 key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
        "400":
          description: 参数错误
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformBadRequest" }
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }

  /api/keys/{id}:
    patch:
      tags: [admin]
      operationId: updateApiKey
      summary: 更新密钥名称/状态/配额(JWT)
      description: 局部更新:仅传入的字段会被修改;status=disabled 可临时停用密钥(停用后一律 401)。
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                status: { type: string, enum: [active, disabled] }
                daily_quota: { type: integer, minimum: 0 }
      responses:
        "200":
          description: 更新后的密钥视图
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyView" }
        "404":
          description: 密钥不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: not_found }
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
    delete:
      tags: [admin]
      operationId: deleteApiKey
      summary: 删除密钥(JWT)
      description: 立即吊销该密钥;使用它的调用方全部转为 401 unauthorized。
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              example: { ok: true }
        "404":
          description: 密钥不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }

  /api/stats/overview:
    get:
      tags: [admin]
      operationId: statsOverview
      summary: 用量总览(JWT)
      description: 今日/累计调用与计费次数、24h 成功率、活跃密钥数与分引擎调用统计,风控与用量治理台首屏。
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 总览统计
          content:
            application/json:
              schema:
                type: object
                properties:
                  today_calls: { type: integer }
                  today_units: { type: integer }
                  total_calls: { type: integer }
                  total_units: { type: integer }
                  active_keys: { type: integer }
                  success_rate_24h: { type: number, example: 97.5 }
                  today_calls_all: { type: integer }
                  rejected_today_24h: { type: integer }
                  by_engine:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        calls: { type: integer }
                        ok: { type: integer }
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }

  /api/stats/timeseries:
    get:
      tags: [admin]
      operationId: statsTimeseries
      summary: 按日用量时间序列(JWT)
      description: 最近 N 天(days 参数,1..90,默认 14)的按日调用数、计费次数与成功数,日期升序零填充。
      security:
        - BearerAuth: []
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 14 }
      responses:
        "200":
          description: 日期升序、零填充
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date: { type: string, example: "2026-11-15" }
                    calls: { type: integer }
                    units: { type: integer }
                    ok: { type: integer }
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }

  /api/usage:
    get:
      tags: [admin]
      operationId: listUsage
      summary: 使用日志(JWT,新→旧)
      description: 分页返回每次调用的端点、引擎、URL 数、计费次数(units)、HTTP 状态与耗时;支持 key_id 过滤。
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: key_id
          in: query
          description: 按密钥过滤
          schema: { type: string }
      responses:
        "200":
          description: 分页使用日志
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        time: { type: string, format: date-time }
                        key_id: { type: string }
                        key_name: { type: string }
                        endpoint: { type: string }
                        engines: { type: array, items: { type: string } }
                        urls: { type: integer }
                        units: { type: integer }
                        status: { type: integer }
                        took_ms: { type: integer }
                        outcome: { type: string, enum: [billed, engine_failed, rejected], description: S4 前存量记录为 "" }
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }

  /api/auth/logout:
    post:
      tags: [admin]
      operationId: adminLogout
      summary: 退出登录(S4) — 撤销当前会话并清除 httpOnly cookie
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 已撤销当前会话
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean, example: true } } }

  /api/auth/refresh:
    post:
      tags: [admin]
      operationId: adminAuthRefresh
      summary: 会话滑动续期(S4) — 同会话签发新 token 并滑动过期时间
      description: 返回体与登录一致(token/expires_in);新 token 绑定同一会话、携带新 jti。Set-Cookie 同步刷新。
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 续期成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_in: { type: integer, example: 86400 }

  /api/runtime:
    get:
      tags: [admin]
      operationId: adminRuntime
      summary: 运行时指标(S4,自公开 /health 的 system 块收敛至此,JWT)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: goroutine/内存/Go 版本/运行时长/应用版本
          content:
            application/json:
              schema:
                type: object
                properties:
                  go_version: { type: string, example: go1.26.0 }
                  goroutines: { type: integer, example: 42 }
                  memory_mb: { type: integer, example: 187 }
                  uptime_seconds: { type: integer, example: 86400 }
                  version: { type: string, example: "0.8.19" }

  /api/keys/{id}/rotate:
    post:
      tags: [admin]
      operationId: rotateApiKey
      summary: 轮换密钥(S4) — 保留 id/名称/配额/计数,一次性返回新密钥;旧密钥即时失效
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 轮换成功(响应形状与创建密钥一致:key 字段仅此一次)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
        "404": { description: 密钥不存在 }

  /api/sessions:
    get:
      tags: [admin]
      operationId: listAdminSessions
      summary: 管理员会话列表(S4) — IP/最后活跃/当前会话标记,活跃在前
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 活跃会话(未撤销未过期)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        ip: { type: string }
                        user_agent: { type: string }
                        created_at: { type: string, format: date-time }
                        last_active_at: { type: string, format: date-time }
                        expires_at: { type: string, format: date-time }
                        current: { type: boolean, description: 请求者本人的会话 }

  /api/sessions/{id}:
    delete:
      tags: [admin]
      operationId: revokeAdminSession
      summary: 撤销指定会话(S4);撤销当前会话等同退出登录
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已撤销 }
        "404": { description: 会话不存在 }

  /api/audit:
    get:
      tags: [admin]
      operationId: queryAuditTrail
      summary: 安全审计轨迹(S4) — <data_dir>/audit.log 的 JSON Lines 查询(新→旧)
      description: 记录登录成功/失败/锁定、密钥增删改轮换、改密、冷却 reset/force、会话撤销/续期/登出、用量导出与备份导出。
      security:
        - BearerAuth: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: 审计条目
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        ts: { type: string, format: date-time }
                        actor: { type: string }
                        ip: { type: string }
                        action: { type: string, example: key.rotate }
                        target: { type: string }
                        result: { type: string }
                        request_id: { type: string }

  /api/usage/export:
    get:
      tags: [admin]
      operationId: exportUsage
      summary: 用量导出下载(S4) — csv|json 附件
      security:
        - BearerAuth: []
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, json], default: csv } }
        - { name: key_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, description: "YYYY-MM-DD 或 RFC3339" } }
        - { name: to, in: query, schema: { type: string, description: "YYYY-MM-DD(含当日) 或 RFC3339" } }
      responses:
        "200":
          description: 附件流 attachment 响应
          content:
            text/csv: {}
            application/json: {}

  /api/reconcile:
    get:
      tags: [admin]
      operationId: reconcileUsage
      summary: 扣费-流水对账(S4) — 落账次数(charged_units) vs 信封引擎 OK 合计
      description: B-01 修复后两者应一致;历史记录(修复前)允许 mismatch,samples 列出前 10 条。
      security:
        - BearerAuth: []
      parameters:
        - { name: date, in: query, schema: { type: string, example: "2026-11-16" } }
      responses:
        "200":
          description: 对账结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string }
                  charged_units: { type: integer }
                  journaled_units: { type: integer }
                  mismatch_count: { type: integer }
                  samples: { type: array, items: { type: object } }

  /api/admin/backup:
    get:
      tags: [admin]
      operationId: downloadBackup
      summary: 下载数据一致性快照(S4) — bbolt 热备(WriteTo)或 JSON 回退文档,attachment
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 快照文件(web2api.db / web2api.json)
          content:
            application/octet-stream: {}

  /api/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: 用户列表(JWT, admin)
      description: 最小角色 admin;返回 total/items,不含密码哈希。
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, example: 2 }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UserView" }
        "401":
          description: JWT 缺失/过期(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "403":
          description: 角色不足(insufficient_role)或命中 IP/CIDR 黑名单(blacklisted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForbiddenError" }

    post:
      tags: [admin]
      operationId: createUser
      summary: 新建用户(JWT, admin)
      description: role 取 admin/operator/viewer,新用户 status 固定 active;用户名重复或密码不合规回 400。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string, minLength: 2, maxLength: 64, example: ops01 }
                password: { type: string, minLength: 8 }
                role: { type: string, enum: [admin, operator, viewer] }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  user: { $ref: "#/components/schemas/UserView" }
        "400":
          description: 参数非法(INVALID_PARAM,中文 message)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformBadRequest" }
        "401":
          description: JWT 缺失/过期(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "403":
          description: 角色不足(insufficient_role)或命中 IP/CIDR 黑名单(blacklisted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForbiddenError" }

  /api/users/{id}:
    patch:
      tags: [admin]
      operationId: updateUser
      summary: 修改用户角色/状态(JWT, admin)
      description: |
        最小角色 admin。不能修改/禁用当前登录账号;不能降级或禁用最后一名 active admin。
        变更会撤销该用户的会话。
