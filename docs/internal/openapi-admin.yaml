            application/json:
              schema: { $ref: "#/components/schemas/ForbiddenError" }


  /api/engines:
    get:
      tags: [admin]
      operationId: adminEngines
      summary: 引擎运行状态看板(JWT)
      description: |
        契约 A:每引擎增加冷却状态机字段
        `{state:"ok|cooldown|circuit_open", until, reason, consecutive_blocks, last_error_at}`。
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 引擎状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  engines:
                    type: array
                    items:
                      type: object
                      properties:
                        engine: { type: string, example: baidu }
                        endpoint: { type: string }
                        enabled: { type: boolean }
                        state:
                          type: string
                          enum: [ok, cooldown, circuit_open]
                          example: ok
                        until:
                          type: string
                          format: date-time
                          description: 冷却/熔断到期时间(正常时为空)
                        reason:
                          type: string
                          description: 进入当前状态的原因(COOLDOWN/BLOCKED/CAPTCHA/…)
                        consecutive_blocks: { type: integer, example: 0 }
                        last_error_at:
                          type: string
                          format: date-time
                        breaker:
                          type: object
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }

  /api/engines/{name}/cooldown/reset:
    post:
      tags: [admin]
      operationId: resetEngineCooldown
      summary: 强制恢复引擎(JWT)
      description: 立即清除该引擎的冷却/熔断状态,连续计数归零。用于维护窗口后的手动恢复。
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, enum: [baidu, sogou, so360, bing] }
      responses:
        "200":
          description: 已恢复
          content:
            application/json:
              example: { ok: true, engine: baidu }
        "404":
          description: 未知引擎
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }

  /api/engines/{name}/cooldown/force:
    post:
      tags: [admin]
      operationId: forceEngineCooldown
      summary: 强制冷却引擎(JWT)
      description: 手动将引擎置入冷却 N 分钟,用于维护窗口;冷却期内该引擎 search/check 快速失败(503 engine_cooldown)。
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, enum: [baidu, sogou, so360, bing] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                  example: 30
      responses:
        "200":
          description: 已进入冷却
          content:
            application/json:
              example:
                ok: true
                engine: baidu
                until: "2026-11-15T12:30:00Z"
        "400":
          description: 参数错误
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformBadRequest" }
        "404":
          description: 未知引擎
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }

  /api/playground/check:
    post:
      tags: [admin]
      operationId: playgroundCheck
      summary: 面板在线调试收录检测(JWT,不计费)
      description: 复用 /v1/index/check 同一编排(CheckIndexBatch),响应结构与 /v1/index/check 完全一致;面板调试不计费。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  items: { type: string, format: uri }
                  minItems: 1
                  maxItems: 20
                engines:
                  type: array
                  items: { type: string, enum: [baidu, sogou, so360, bing] }
      responses:
        "200":
          description: 与 /v1/index/check 完全一致的结果结构
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexCheckResponse" }
        "400":
          description: 参数错误
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformBadRequest" }
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }

  /mcp:
    get:
      tags: [agent-plane]
      operationId: mcpGetUnsupported
      summary: GET 不提供 SSE 流
      description: 此路由固定返回 405。使用 POST 发送 JSON-RPC 消息，使用 DELETE 关闭会话。
      responses:
        "405":
          description: 使用 POST 发送 JSON-RPC 消息。
          content:
            application/json:
              example: { error: method_not_allowed }
    post:
      tags: [agent-plane]
      operationId: mcpRpc
      summary: MCP streamable HTTP(JSON-RPC 2.0)
      description: |
        Model Context Protocol 入口(响应式 JSON:每条消息单独 POST,服务端回单个 JSON 对象)。

        **方法**:
        * `initialize` — 握手;服务端以支持的 legacy 版本应答(默认 `2025-06-18`),`serverInfo.name="web2api"`;
          响应头返回 `Mcp-Session-Id`(内存会话,空闲 30 分钟过期)。
        * `notifications/initialized` — 通知,回 HTTP 204(无 id)。
        * `tools/list` — 6 个工具:`web_search`、`check_indexed`、`get_index_job`、`cancel_index_job`、`get_quota`、`list_engines`。
        * `tools/call` — 结果统一 `{content:[{type:"text",text:"<JSON字符串>"}], isError}`;入参校验失败回 JSON-RPC `-32602`(HTTP 200)。
        * `ping` — 回 `{}`。

        **鉴权**:`X-API-Key`(计费)或 `Authorization: Bearer <JWT>`(管理员,不计费);JWT 必须带 sid 且持久化角色为 admin,否则 `403 {"error":"forbidden","code":"insufficient_role"}`;未授权 401 平台信封。

        **计费**:`web_search` 每次调用计 1 次;`check_indexed` = 条数×引擎数次(`>20` 条转异步任务时按提交条数计);`get_index_job`/`cancel_index_job`/`get_quota`/`list_engines` 不计费。

        **JSON-RPC 错误码**:`-32700` 解析错误(HTTP 400)、`-32600` 请求无效(不支持批量)、`-32601` 方法不存在、
        `-32602` 入参校验失败、`-32001` 会话不存在(HTTP 404)。

        **Origin 校验**:无效 Origin(非绝对 http/https URL)回 403(MCP 规范)。
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  oneOf:
                    - type: integer
                    - type: string
                  description: 通知(无 id)不回响应体
                method:
                  type: string
                  enum: [initialize, notifications/initialized, tools/list, tools/call, ping]
                params:
                  type: object
            examples:
              initialize:
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: "2025-06-18"
                    capabilities: {}
                    clientInfo: { name: my-agent, version: "1.0" }
              toolsCall:
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: tools/call
                  params:
                    name: check_indexed
                    arguments:
                      urls: ["https://example.com/a", "https://example.com/b"]
      responses:
        "200":
          description: JSON-RPC 2.0 响应(成功或 error 对象)
          headers:
            Mcp-Session-Id:
              description: initialize 时下发;后续请求原样携带
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
              examples:
                initialized:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result:
                      protocolVersion: "2025-06-18"
                      capabilities: { tools: { listChanged: false } }
                      serverInfo: { name: web2api, version: "1.0" }  # B-07 版本中性化: 示例同样不带真实版本号
                invalidParams:
                  value:
                    jsonrpc: "2.0"
                    id: 2
                    error: { code: -32602, message: "invalid params: urls accepts at most 5000 entries, got 5001" }
        "204":
          description: 通知(notifications/initialized)已受理,无响应体
        "400":
          description: JSON 解析失败或请求无效(JSON-RPC 信封)
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: null
                error: { code: -32700, message: "parse error: body is not valid JSON" }
        "401":
          description: 未授权(平台信封;X-API-Key 校验与配额预检由 AuthAny 负责)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "403":
          description: Origin 校验失败(MCP 规范)或管理员 JWT 身份不符(code=insufficient_role)
          content:
            application/json:
              example: { error: invalid_origin }
        "404":
          description: Mcp-Session-Id 未知、已过期或归属其他身份(HTTP 404 + JSON-RPC -32001)
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: null
                error: { code: -32001, message: "session not found; send initialize again" }
        "429":
          description: 配额超限或限流(平台信封)+ Retry-After
          headers:
            Retry-After: { description: 重试等待秒数, schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: quota_exceeded }

    delete:
      tags: [agent-plane]
      operationId: terminateMcpSession
      summary: 关闭当前身份的 MCP 会话
      description: 使用签发会话时的 API Key 身份或管理员账号鉴权，并发送初始化返回的会话 ID。
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - in: header
          name: Mcp-Session-Id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: 会话已关闭
        "401":
          description: 未授权
        "403":
          description: Origin 校验失败
        "404":
          description: 会话未知、已过期或归属其他身份

  /openapi.yaml:
    get:
      tags: [agent-plane]
      operationId: getOpenApiSpec
      summary: 本 OpenAPI 3.1 规范(go:embed 静态资源,公开)
      description: 浏览器请求可返回 HTML 阅读页。使用 raw=1 固定获取 YAML 供工具导入。
      parameters:
        - { name: raw, in: query, schema: { type: string, enum: ["1"] }, description: 返回原始 YAML。 }
      responses:
        "200":
          description: YAML 规范文件
          content:
            application/yaml:
              schema: { type: string }
            text/html:
              schema: { type: string }

  /llms.txt:
    get:
      tags: [agent-plane]
      operationId: getLlmsTxt
      summary: 平台简介与端点清单(llms.txt,公开)
      description: 浏览器请求可返回 HTML 阅读页。使用 raw=1 固定获取纯文本。
      parameters:
        - { name: raw, in: query, schema: { type: string, enum: ["1"] }, description: 返回原始纯文本。 }
      responses:
        "200":
          description: llms.txt 内容
          content:
            text/plain:
              schema: { type: string }
            text/html:
              schema: { type: string }

components:
  securitySchemes:
    MetricsTokenAuth:
      type: http
      scheme: bearer
      description: security.metrics_token 配置的独立指标凭据。

    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 平台签发的 API 密钥(sk-w2a-…),在管理面板「API密钥」页创建;按次计费(URL 数 × 引擎数)。
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 管理员 JWT(控制台登录获得),管理员调用不计费。
  schemas:
    EngineStatusSnapshot:
      type: object
      required: [engines, generated_at]
      properties:
        generated_at: { type: string, example: "2026-11-25 15:09:29", description: 服务器本地时间。 }
        engines:
          type: array
          items:
            type: object
            properties:
              engine: { type: string, example: baidu }
              endpoint: { type: string, example: /web-tool/baidu/search }
              enabled: { type: boolean }
              state: { type: string, enum: [ok, cooldown, circuit_open] }
              until: { type: [string, "null"], format: date-time }
              reason: { type: string, enum: ["", COOLDOWN, FORCED] }
              consecutive_blocks: { type: integer, minimum: 0 }
              last_error_at: { type: [string, "null"], format: date-time }
              breaker: { type: object }

    HealthSnapshot:
      type: object
      required: [status, uptime, engines]
      properties:
        status: { type: string, enum: [healthy, degraded, unhealthy] }
        uptime: { type: string, example: 2h13m }
        engines:
          type: array
          items:
            type: object
            required: [name, initialized, status]
            properties:
              name: { type: string, example: baidu }
              initialized: { type: boolean }
              status: { type: string, enum: [ready, not_initialized, circuit_open] }
        storage: { type: string, enum: [bbolt, json], description: 平台关闭时省略。 }

    PlatformError:
      type: object
      description: 平台信封错误(/v1/*、/mcp)。
      properties:
        error:
          type: string
          examples: [unauthorized, forbidden, quota_exceeded, not_found, too_many_attempts, rate_limited, server_error]
        retry_after_seconds: { type: integer, minimum: 1 }
      required: [error]

    PlatformBadRequest:
      type: object
      description: 平台 400 信封,reason ∈ EMPTY_QUERY/TOO_MANY_URLS/INVALID_PARAM。
      properties:
        error: { type: string, example: bad_request }
        code: { type: string, example: INVALID_PARAM }
        reason: { type: string, example: INVALID_PARAM }
      required: [error]

    InsufficientRoleError:
      type: object
      description: 角色不足的 403 平台信封。
      properties:
        error: { type: string, example: forbidden }
        code: { type: string, example: insufficient_role }
      required: [error, code]

    BlacklistedError:
      type: object
      description: IP/CIDR 黑名单命中的 403 平台信封(守卫先于其它中间件)。
      properties:
        error: { type: string, example: forbidden }
        reason: { type: string, example: blacklisted }
      required: [error, reason]

    ForbiddenError:
      type: object
      description: 403 平台信封;角色不足带 code=insufficient_role,黑名单命中带 reason=blacklisted。
      properties:
        error: { type: string, example: forbidden }
        code: { type: string, example: insufficient_role }
        reason: { type: string, example: blacklisted }
      required: [error]

    UserView:
      type: object
      description: 控制台用户(不含密码哈希)。
      properties:
        id: { type: string }
        username: { type: string, example: admin }
        role: { type: string, enum: [admin, operator, viewer] }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
        last_login_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]

    BlacklistEntryView:
      type: object
      description: IP/CIDR 黑名单条目;expired 为派生字段,过期规则只忽略不自动删除。
      properties:
        id: { type: string }
        kind: { type: string, enum: [ip, cidr] }
        value: { type: string, example: 198.51.100.0/24 }
        reason: { type: string }
        created_by: { type: string, example: admin }
        created_at: { type: string, format: date-time }
        expires_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        hits: { type: integer, example: 0 }
        last_hit_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        expired: { type: boolean, example: false }

    LogEntryView:
      type: object
      description: 一行服务日志;message 为不可信诊断文本,只展示不执行。
      properties:
        time: { type: string, format: date-time }
        level: { type: string, example: info }
        message: { type: string }
        source: { type: string, example: logs.txt.1 }

    LogConfigView:
      type: object
      description: 日志轮转与保留配置(只读)。
      properties:
        max_mb: { type: integer, example: 10 }
        backups: { type: integer, example: 5 }
        retention_days: { type: integer, example: 30, description: 0=仅按份数保留 }
        format: { type: string, enum: [text, json] }
        file_logging_enabled: { type: boolean, example: true, description: false=当前进程未写 logs.txt(quiet/debug/关闭落盘) }
        audit_retention_days: { type: integer, example: 30 }

    IndexJobAccepted:
      type: object
      description: >-
        POST /v1/index/check 在 urls > 20 且开启 index_jobs 时的 202 回执。任务已入队,
        服务端逐条执行，所选引擎全部冷却时等待恢复。扣费按提交单元数计算，total 是去重后的任务行数。
      properties:
        job_id: { type: string, example: job_20261124T054613_379221272c }
        status:
          type: string
          enum: [queued, running, waiting, done, cancelled, failed]
        total: { type: integer, description: 去重后的 URL 条数 }
        engines:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        poll_url: { type: string, description: 进度端点(相对路径,带部署前缀) }
        results_url: { type: string, description: 结果端点 }
        csv_url: { type: string, description: CSV 下载端点 }
        note: { type: string }
      required: [job_id, status, total]

    IndexJobView:
      type: object
      description: 异步收录任务的进度视图。
      properties:
        job_id: { type: string }
        status:
          type: string
          enum: [queued, running, waiting, done, cancelled, failed]
        progress: { type: number, description: 服务端报告的进度。可用 completed / total 计算已完成行数比例。 }
        total: { type: integer }
        completed: { type: integer, description: 已产出最终结论(含失败)的条数 }
        indexed: { type: integer }
        not_indexed: { type: integer }
        failed: { type: integer }
        retrying: { type: integer, description: 等待重试的行数 }
        wait_seconds: { type: integer, description: 正在等待的冷却剩余秒数(status=waiting 时) }
        eta_seconds: { type: integer, description: 剩余时间的粗略估计(按引擎令牌间隔) }
        interval_ms: { type: integer, description: 该任务引擎的令牌间隔(百度默认 12000) }
        engines:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, description: 任务未结束时省略。 }
        last_error: { type: string }
        poll_url: { type: string }
        results_url: { type: string }
        csv_url: { type: string }
      required: [job_id, status, total, completed]

    DataPlaneError:
      type: object
      description: 数据面信封错误(核心端点)。
      properties:
        error: { type: string, example: invalid_param }
        code: { type: integer, example: 400 }
        request_id: { type: string, example: req_9f2c }
        message: { type: string }
        reason: { type: string, example: INVALID_PARAM }
        retry_after_seconds: { type: integer, minimum: 1 }
        meta:
          type: object
          additionalProperties: true
      required: [error, code, message]

    JsonRpcResponse:
      type: object
      description: JSON-RPC 2.0 响应(result 与 error 二选一)。
      properties:
        jsonrpc: { type: string, example: "2.0" }
        id:
          oneOf: [{ type: integer }, { type: string }, { type: "null" }]
        result:
          description: |
            tools/call 的 result 统一为
            `{content:[{type:"text",text:"<JSON字符串>"}], isError:false}`;
            工具执行失败时 isError:true 且 text 为 {"error":{...}}。
        error:
          type: object
          properties:
            code: { type: integer, example: -32602 }
            message: { type: string }
            data: {}
      required: [jsonrpc, id]

    ApiKeyView:
      type: object
      properties:
        id: { type: string, example: key_01H... }
        name: { type: string, example: seo-bot }
        prefix: { type: string, example: sk-w2a-3f9c }
        status: { type: string, enum: [active, disabled] }
        daily_quota: { type: integer }
        used_today: { type: integer }
        used_total: { type: integer }
        created_at: { type: string, format: date-time }
        last_used_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]

    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKeyView"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              example: sk-w2a-…
              description: 一次性完整密钥(创建/轮换响应返回,之后只存哈希)

    SearchResult:
      type: object
      properties:
        id: { type: string }
        rank: { type: integer, example: 1 }
        type: { type: string, example: organic }
        title: { type: string, example: Fiber 框架教程 }
        url: { type: string, example: https://example.com/post }
        display_url: { type: string }
        snippet: { type: string }
        domain: { type: string, example: example.com }
        engine: { type: string, example: baidu }

    SearchEnvelope:
      type: object
      properties:
        query:
          type: object
          properties:
            text: { type: string }
            engines_requested: { type: array, items: { type: string } }
        meta:
          type: object
          properties:
            request_id: { type: string }
            requested_at: { type: string, format: date-time }
            took_ms: { type: integer }
            engines: { type: array, items: { type: string } }
            engines_failed: { type: array, items: { type: string } }
            engines_cooldown:
              type: array
              description: 契约 A — 冷却中的引擎(meta 增强)
              items:
                type: object
                properties:
                  engine: { type: string }
                  until: { type: string, format: date-time }
                  reason: { type: string, example: COOLDOWN }
            version: { type: string, example: "2.1" }
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
        serp_features:
          type: array
          items: { type: object }
        pagination:
          type: object
          properties:
            page: { type: integer }
            has_more: { type: boolean }
            next_start: { type: integer }

    IndexCheckResponse:
      type: object
      description: /v1/index/check 的统一响应结构(控制台在线调试返回同构结果)。
      properties:
        id: { type: string, example: req_9f2c }
        created_at: { type: string, format: date-time }
        results:
          type: array
          items:
            type: object
            properties:
              url: { type: string, example: https://example.com/a }
              engines:
                type: object
                description: 每引擎判定结果:成功 {indexed,match?,matched_result_url?,…};失败 {error:{code,message}}
                additionalProperties:
                  oneOf:
                    - type: object
                      required: [indexed]
                      properties:
                        indexed: { type: boolean, example: true }
                        match: { type: string }
                        matched_result_url: { type: string }
                        total_results: { type: integer }
                        took_ms: { type: integer }
                    - type: object
                      required: [error]
                      properties:
                        error:
                          type: object
                          properties:
                            code: { type: string, example: engine_cooldown }
                            message: { type: string }
                            retry_after_seconds: { type: integer, minimum: 1 }
        meta:
          type: object
          properties:
            request_id: { type: string }
            took_ms: { type: integer }
            units: { type: integer, example: 8, description: 请求单元总数（去重 URL 数 × 引擎数），实际扣费只计成功单元。 }
