      responses:
        "200":
          description: 重置成功(该用户会话已撤销)
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean, example: true } } }
        "400":
          description: 参数非法(INVALID_PARAM,中文 message)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformBadRequest" }
        "401":
          description: JWT 缺失/过期(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "403":
          description: 角色不足(insufficient_role)或命中 IP/CIDR 黑名单(blacklisted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForbiddenError" }
        "404":
          description: 资源不存在(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: not_found }

  /api/blacklist:
    get:
      tags: [admin]
      operationId: listBlacklist
      summary: 黑名单列表(JWT, operator+)
      description: 返回 total/items;expired 为派生字段,过期规则只被忽略,不自动删除。
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 黑名单条目
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, example: 1 }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BlacklistEntryView" }
        "401":
          description: JWT 缺失/过期(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "403":
          description: 角色不足(insufficient_role)或命中 IP/CIDR 黑名单(blacklisted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForbiddenError" }

    post:
      tags: [admin]
      operationId: createBlacklist
      summary: 新增 IP/CIDR 黑名单规则(JWT, operator+)
      description: |
        最小角色 operator。kind 省略时按 value 推断 ip/cidr;非法 IP/CIDR 或重复规则回 400。
        expires_at 须为 RFC3339 且晚于当前时间,省略表示永久。命中请求回 403 reason=blacklisted。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                kind: { type: string, enum: [ip, cidr], description: 可省略,按 value 推断 }
                value: { type: string, example: 198.51.100.0/24 }
                reason: { type: string, example: abusive crawler }
                expires_at: { type: string, format: date-time, description: 可选,RFC3339 且晚于当前时间 }
      responses:
        "200":
          description: 新增成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  entry: { $ref: "#/components/schemas/BlacklistEntryView" }
        "400":
          description: 参数非法(INVALID_PARAM,中文 message)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformBadRequest" }
        "401":
          description: JWT 缺失/过期(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "403":
          description: 角色不足(insufficient_role)或命中 IP/CIDR 黑名单(blacklisted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForbiddenError" }

  /api/blacklist/{id}:
    patch:
      tags: [admin]
      operationId: updateBlacklist
      summary: 修改黑名单规则(JWT, operator+)
      description: 最小角色 operator;expires_at 传空串表示永久,省略表示不改。
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
                expires_at: { type: string, description: RFC3339 或空串;空串=永久 }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  entry: { $ref: "#/components/schemas/BlacklistEntryView" }
        "400":
          description: 参数非法(INVALID_PARAM,中文 message)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformBadRequest" }
        "401":
          description: JWT 缺失/过期(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "403":
          description: 角色不足(insufficient_role)或命中 IP/CIDR 黑名单(blacklisted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForbiddenError" }
        "404":
          description: 资源不存在(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: not_found }

    delete:
      tags: [admin]
      operationId: deleteBlacklist
      summary: 删除黑名单规则(JWT, operator+)
      description: 最小角色 operator;过期规则不会自动删除,需手动 DELETE。
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean, example: true } } }
        "401":
          description: JWT 缺失/过期(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "403":
          description: 角色不足(insufficient_role)或命中 IP/CIDR 黑名单(blacklisted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForbiddenError" }
        "404":
          description: 资源不存在(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: not_found }

  /api/logs:
    get:
      tags: [admin]
      operationId: queryLogs
      summary: 查询服务日志(JWT, viewer+)
      description: |
        最小角色 viewer。读取 logs.txt 及其滚动文件的文本/JSON 两种格式;
        日志行是不受信诊断数据,只展示不执行。since 接受 RFC3339。
      security:
        - BearerAuth: []
      parameters:
        - name: level
          in: query
          schema: { type: string }
          description: 精确匹配日志级别
        - name: q
          in: query
          schema: { type: string }
          description: 消息子串过滤
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: RFC3339 起始时间
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: 日志条目(新→旧)
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, example: 17 }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LogEntryView" }
        "400":
          description: 参数非法(INVALID_PARAM,中文 message)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformBadRequest" }
        "401":
          description: JWT 缺失/过期(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "403":
          description: 角色不足(insufficient_role)或命中 IP/CIDR 黑名单(blacklisted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForbiddenError" }

  /api/logs/config:
    get:
      tags: [admin]
      operationId: logsConfig
      summary: 日志轮转/保留配置(JWT, viewer+)
      description: 最小角色 viewer;只读当前生效值,配置来源为 app.log_*。
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 当前日志配置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogConfigView" }
        "401":
          description: JWT 缺失/过期(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "403":
          description: 角色不足(insufficient_role)或命中 IP/CIDR 黑名单(blacklisted)
