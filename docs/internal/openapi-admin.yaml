        "403":
          description: 角色不足(insufficient_role)或命中 IP/CIDR 黑名单(blacklisted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForbiddenError" }
        "404":
          description: 资源不存在(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
