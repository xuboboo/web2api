services:
  web2api:
    container_name: serp
    init: true
    # Chrome needs more than the default 64MB /dev/shm. 2gb is safe on normal hosts;
    # on 1.4GB-RAM servers use 512mb (launch already passes --disable-dev-shm-usage).
    shm_size: 512mb
    # Build from source so the image always matches this tree.
    build:
      context: .
    image: web2api:local
    # Bind to loopback unless a reverse proxy terminates TLS in front of it.
    # The data plane requires X-API-Key (security.data_plane_auth=true by
    # default) and the admin plane requires a JWT, but port 7000 is plain HTTP:
    # publishing it on 0.0.0.0 would put admin credentials and API keys on the
    # wire in cleartext. Set WEB2API_SERVER_HOST/SERVER_PORT and a TLS proxy
    # (see deploy/README.md) before exposing the service beyond localhost.
    ports:
      - "127.0.0.1:7000:7000"
    command: serve
    restart: unless-stopped
    volumes:
      - ./config.yaml:/usr/src/app/config.yaml:ro
      # Persist API keys / usage / JWT secret across container recreation.
      - web2api-data:/usr/src/app/data

    # proxies:
    #   entries:
    #     - url: http://user:pass@res-proxy-1.example:8080
    #       tags: [baidu]
    #     - url: http://user:pass@res-proxy-2.example:8080
    #       tags: [baidu]
    # baidu:
    #   proxy: baidu

    # Rate limits and every other engine knob live in config.yaml (bind-mounted
    # above) so there is a single source of truth; do not override them here.
    environment:
      WEB2API_SERVER_HOST: "0.0.0.0"
      WEB2API_SERVER_PORT: 7000

volumes:
  web2api-data:
