services:
  openserp:
    container_name: serp
    init: true
    # Chrome crashes with "Out of memory" on page loads when /dev/shm is the default 64MB. Prefer an enlarged shm over `ipc:host` to keep the container isolated from the host IPC namespace.
    shm_size: 2gb
    # Build from source so the image always matches this tree.
    build:
      context: .
    image: openserp:local
    # Loopback only: the API has no auth layer, never expose it beyond localhost.
    ports:
      - "127.0.0.1:7000:7000"
    command: serve
    restart: unless-stopped
    volumes:
      - ./config.yaml:/usr/src/app/config.yaml:ro

    # proxies:
    #   entries:
    #     - url: http://user:pass@res-proxy-1.example:8080
    #       tags: [google]
    #     - url: http://user:pass@res-proxy-2.example:8080
    #       tags: [google]
    # google:
    #   proxy: google

    # Rate limits and every other engine knob live in config.yaml (bind-mounted
    # above) so there is a single source of truth; do not override them here.
    environment:
      OPENSERP_SERVER_HOST: "0.0.0.0"
      OPENSERP_SERVER_PORT: 7000
