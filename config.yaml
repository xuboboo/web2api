# Web2API 收录情报 & 国内搜索 Agent 数据平台 —— 主配置
# 优先级:CLI 参数 > WEB2API_* 环境变量 > 本文件 > 代码内置默认值(Viper)。
# 环境变量命名:WEB2API_ + 键名大写、. 换 _(例:platform.admin_password → WEB2API_PLATFORM_ADMIN_PASSWORD)。
# serve 可用 --config/-c 指定任意配置文件路径(或 WEB2API_SERVER_CONFIG_PATH)。
# 全部端点固定挂在 /web-tool 前缀下(代码常量 core.BasePath,无配置项):
#   面板 /web-tool/  ·  数据平面 /web-tool/v1/*  ·  Agent 平面 /web-tool/mcp
#   管理平面 /web-tool/api/*  ·  健康 /web-tool/health
# 逐键完整说明见 docs/CONFIGURATION.md。

server:
  host: 0.0.0.0 # API host to bind(容器需 0.0.0.0;单机自用建议 127.0.0.1)
  port: 7000 # API port to bind
  debug: false # Enable debug logs and force browser UI mode
  verbose: false # Enable debug-level request logs
  raw_requests: false # true = 纯 HTTP 模式(无浏览器):结果不稳定、无 bing、收录判定一律 not_implemented(README「raw 模式」节),生产勿开
  insecure: true # Allow insecure TLS connections(容器/内网缺根证书时需要)

app:
  log_format: "text" # json|text
  log_level: "" # error|warn|info|debug|trace; empty = warn for CLI, info for serve
  save_log: true # Also write logs to ./logs.txt in serve mode; false = stderr only
  timeout: 15 # Browser/search timeout in seconds, per attempt; the request deadline is derived from this x retries
  browser_path: "" # Custom browser binary path (chrome/chromium/edge..)
  profiles: "" # Overriding built-in browser profiles
  head: false # Headful mode
  leakless: false # Force browser process cleanup after request
  leave_head: false # Keep tabs open after request
  block_resources: "image,font,css,media" # Block heavy subresources in browser mode
  block_trackers: true # Block known tracker domains
  max_processes: 6 # Concurrent Chrome processes
  idle_ttl: 5m # close a Chrome that has not served traffic for this long

proxies:
  allow_request_proxy_url: true
  # Force a single proxy for all engines.
  # Same behavior as passing --proxy on the CLI.
  #global: http://127.0.0.1:8080

  # Advanced mode: define tagged proxy pools and opt engines in with `proxy: <tag>`.
  #entries:
  #  - url: http://127.0.0.1:8080
  #    tags: [default, us]
  #  - url: socks5h://127.0.0.1:1080
  #    tags: [eu]
  health:
    failure_threshold: 2 # Disable proxy after this many consecutive failures
  lanes:
    enabled: true # Reuse browser profile/cookies per engine + proxy session ID
    max_lanes: 100 # LRU cap for sticky lanes kept in worker memory
    drop_cookies_on_challenge: true # Clear lane cookies on captcha/challenge only

cache:
  ttl_seconds: 120 # Dedicated endpoint cache TTL in seconds (0 disables cache)
  max_size: 1000 # Maximum cached dedicated responses before oldest-entry eviction

resilience:
  max_retries: 1 # Retry attempts per engine request (0 disables retries)
  allow_endpoint_fallback: false # Keep dedicated endpoints engine-pure by default

circuit_breaker:
  failures: 8 # 连续失败多少次开启熔断（国内引擎反爬波动大，给足重试空间）
  recovery_seconds: 20 # 熔断后多久进入半开（缩短恢复时间）
  successes: 1 # 半开状态下 1 次成功即恢复
  # 熔断针对「技术性失败」(超时/解析失败/引擎 5xx),与下面的引擎冷却(反爬拦截)是两套
  # 独立机制:冷却检查在前(冷却中的引擎不发真实请求)。

# ---------------------------------------------------------------------------
# stability(引擎 IP 冷却状态机,契约 A)
# 连续第 1/2/3+ 次被拦截(blocked 403 / 429 / captcha)分别按 steps_minutes 的
# 第 1/2/3 档冷却(最后一个值向后延续);连续无拦截达 reset_after_minutes 后,
# 连续计数归零(重新从第 1 档起算)。
# 冷却期内该引擎所有 search/check 快速失败:HTTP 503 {"error":"engine_cooldown",
# "reason":"COOLDOWN","retry_after_seconds":N} + Retry-After 头,不发真实请求;
# 到期放行一个探测请求,成功恢复、失败进下一档。运维可调:
#   POST /web-tool/api/engines/{name}/cooldown/reset  强制恢复
#   POST /web-tool/api/engines/{name}/cooldown/force  {"minutes":N} 强制冷却(维护窗口)
# 面板「引擎状态」页(#/engines)提供冷却倒计时与同款按钮。
# ---------------------------------------------------------------------------
stability:
  engine_cooldown:
    steps_minutes: [10, 30, 120] # 连续第1/2/3+次拦截分别冷却的分钟数(最后一个值向后延续)
    reset_after_minutes: 240 # 连续无拦截达该分钟数,连续计数归零

cors:
  enabled: true
  allow_origins: "*"
  allow_methods: "GET, POST, OPTIONS"
  allow_headers: "Origin, Content-Type, Accept, Authorization, X-Use-Proxy, X-Proxy-URL, X-Proxy-Country, X-Proxy-Class, X-Proxy-Provider, X-Proxy-Session-ID, X-Request-ID, X-Tenant, X-Use-Profile"
  max_age: 86400

# ---------------------------------------------------------------------------
# 2captcha 自动解题(可选)。三件组合缺一不可(校验逻辑在 cmd/captcha_config.go):
#   1. 解开本节(apikey 允许留空)—— viper 仅对「存在的键」绑定环境变量,
#      WEB2API_2CAPTCHA_APIKEY 只在本节存在时生效(已实测;本节整体注释时该环境变量不生效,
#      此时密钥只能经 --2captcha_key 传入);
#   2. captcha.solver_enabled: true(全局闸门);
#   3. 密钥非空:2captcha.apikey / CLI --2captcha_key / 环境变量 WEB2API_2CAPTCHA_APIKEY 三者其一。
# solver_enabled=true 而 apikey 为空 → serve 启动直接报错退出。
# 推荐组合(密钥不落盘):解开本节且 apikey 留空 + solver_enabled: true + 环境变量注入密钥:
#   2captcha:
#     apikey: ""
#   export WEB2API_2CAPTCHA_APIKEY="你的2captcha密钥"
# ---------------------------------------------------------------------------
# 2captcha:
#   apikey: "123123123123123"

captcha:
  solver_enabled: false # Global captcha solver gate (requires 2captcha.apikey)

# ---------------------------------------------------------------------------
# security(控制平面加固,契约 B)
# 修改密码 POST /web-tool/api/auth/password(新密码≥8位)成功后 token_version+1,
# 全部旧 JWT 立即失效;新密码 bcrypt 哈希存 settings 桶并覆盖 config 默认值。
# ---------------------------------------------------------------------------
security:
  admin_rate_per_minute: 60 # /api/* 全局限速,超限 429 {"error":"rate_limited"} + Retry-After
  data_plane_auth: false # true 时 /{engine}/search 与 /stats/* 需 X-API-Key(默认关,行为与现状一致)
  login_lockout:
    fails: 5 # 同一 用户名+IP 连续登录失败阈值
    minutes: 15 # 锁定时长(期间登录一律 429 {"error":"too_many_attempts"} + Retry-After)

# ---------------------------------------------------------------------------
# 收录查询平台(platform)
#
# 管理面板 + 公网 API(/v1/index/check 等)+ 管理 API(/api/*)的后端开关与
# 存储/凭据配置。整个应用固定部署在 /web-tool 子路径之下(代码内常量,无配置项):
#   面板     http://127.0.0.1:7000/web-tool/
#   公网API   http://127.0.0.1:7000/web-tool/v1/...
#   Agent平面 http://127.0.0.1:7000/web-tool/mcp(+ /web-tool/openapi.yaml、/web-tool/llms.txt)
#   管理API   http://127.0.0.1:7000/web-tool/api/...
# enabled=false 时不挂载 /api/* 与 /v1/*,面板静态页与健康端点仍可用。
# 计费口径:1 URL × 1 引擎 = 1 unit;HTTP 200 完成即全额扣费(200 信封内引擎级
# 失败单元不退费);401/400/429 配额预检/503 冷却不扣费。详见 docs/API.md §9。
# ---------------------------------------------------------------------------
platform:
  enabled: true # 是否启用平台 API(密钥/配额/用量/管理端点)
  data_dir: "./data" # bbolt 数据库(web2api.db)、JWT 密钥(secret.key)存放目录
  admin_username: "admin" # 管理员登录名(面板登录用)
  admin_password: "admin123" # 管理员登录密码——生产环境务必修改!
  jwt_expire_hours: 24 # 管理员 JWT 有效期(小时)
  usage_retention_days: 30 # 用量日志滚动保留天数,0=不限(默认 30)

# ---------------------------------------------------------------------------
# 引擎开关
#
#   可用引擎：baidu / sogou / so360 / bing（bing 走 cn.bing.com）
#   任一行都可以用环境变量覆盖，例如 WEB2API_BAIDU_DISABLED=true。
# ---------------------------------------------------------------------------
baidu:
  rate_requests: 12 # 百度对同 IP 高频访问会弹图形验证码，默认 12 次/分钟
  rate_burst: 2
  profile: chrome-win-uhd620 # 桌面 Windows 指纹比 Linux headless 更不容易被反爬拦截
  # 国内主力引擎
  # No proxy tag means direct traffic

bing:
  rate_requests: 60
  rate_burst: 3
  search_box: true # Submit through the homepage; false uses legacy /search URLs (env: WEB2API_BING_SEARCH_BOX)
  # www.bing.com 会 302 到 cn.bing.com，境内可直连；如只想保留国产引擎可改成 disabled: true
  # No proxy tag means direct traffic

# 搜狗（www.sogou.com）。SERP 需要 JS 渲染，浏览器模式；结果链接是
# sogou.com/link?url= 跳转，引擎会自动解析成真实地址。
sogou:
  rate_requests: 8 # 搜狗反爬很敏感：默认 8 次/分钟、突发 1，避免触发验证码
  rate_burst: 1
  profile: chrome-win-uhd620
  # No proxy tag means direct traffic

# 360 搜索（www.so.com）。同样走浏览器模式；结果直达链接在 data-mdurl 上。
so360:
  rate_requests: 20
  rate_burst: 2
  profile: chrome-win-uhd620
  # No proxy tag means direct traffic