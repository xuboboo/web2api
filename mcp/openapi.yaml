openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Web2API 网站收录查询开放平台
  version: "1.0" # 公开规范固定为 1.0,不携带真实应用版本号
  license:
    name: MIT
    url: https://github.com/xuboboo/web2api/blob/main/LICENSE
  description: |
    单二进制自托管的「Web2API 网站收录查询开放平台」。

    三个平面:
    * **数据平面** `/v1/*` — 国内四引擎(百度/搜狗/360/必应)收录判定与搜索,鉴权/配额/限流/冷却内建。
    * **Agent 平面** `/mcp` + 本 spec + `llms.txt` — AI Agent 可直接调用(MCP streamable HTTP,JSON-RPC 2.0)。
    * **控制平面** `/api/*` — 管理面板后台(风控与用量治理台),仅限管理员;公开规范不枚举其端点。

    ## 5 分钟上手(最短路径)
    1. 先用管理员账号登录**控制台**,取得 JWT(管理面端点不在本公开规范中列举)。
    2. 在控制台「API 密钥」页创建密钥 → **完整 key 只返回这一次**,存好。
    3. `POST /v1/index/check` 带 `X-API-Key: <你的key>` + `{"urls":["https://example.com"],"engines":["baidu","bing"]}` → 得到逐引擎 `indexed` 判定。
    4. `GET /v1/quota` 带同一 key 查配额;用量流水在控制台查看。
    带**完整可复制示例、真实响应样例、Python/JS/curl 代码与排错表**的教程见仓库 `docs/QUICKSTART.md`(本文下方 endpoints 逐字段定义)。

    ## 三套错误信封
    1. **平台信封**(`/v1/*`、`/mcp` 鉴权与配额):`{"error":"unauthorized|quota_exceeded|..."}`。配额或访问限流返回 429 和 `Retry-After`。
    2. **数据面信封**(`/{engine}/search` 等核心端点):`{"error":"<code>","code":<http状态>,"request_id":"...","message":"...","reason":"...","meta":{}}`。
    3. **JSON-RPC 信封**(`/mcp`):`{"jsonrpc":"2.0","id":1,"error":{"code":-32602,"message":"..."}}`。

    ## 引擎冷却(风控)
    引擎返回 blocked(403)/429/captcha 会进入冷却状态机:第 1 次冷却 10 分钟、第 2 次 30 分钟、第 3 次及以上 120 分钟;
    随仓库提供的配置将百度的三档覆盖为 2、10、30 分钟。正常批次结束后没有额外冷却，后续请求仍受引擎限流。
    连续无拦截达 `stability.engine_cooldown.reset_after_minutes`（默认 240）后计数归零。
    同步请求开始时，所选引擎全部冷却才返回 503。其余情况查看响应中逐单元的错误，或异步任务的 `waiting` 状态。
    503 `engine_cooldown` 响应携带 `Retry-After`。可通过 `/engines/status` 查看当前各引擎状态。

    ## 限流
    HTTP 429 响应携带 `Retry-After`（秒）。API Key 默认每分钟 120 个请求，设置项为
    `security.api_rate_per_minute`。访问限速返回 `429 {"error":"rate_limited"}`。
servers:
  - url: https://your-host/web-tool
    description: 自托管部署根(替换为你的域名;Dify 等平台导入要求域名格式,禁用 IP)
tags:
  - name: data-plane
    description: 数据平面 — 收录判定与搜索(/v1/*,/{engine}/search)
  - name: agent-plane
    description: Agent 平面 — MCP 与静态资源(/mcp、openapi.yaml、llms.txt)
  - name: admin
    description: 控制平面 — 管理面板后台(/api/*,仅限管理员;公开规范不枚举其端点)
  - name: ops
    description: 运维 — 健康/就绪/运行统计

paths:
  /health:
    get:
      tags: [ops]
      operationId: healthCheck
      summary: 健康检查
      description: 各引擎初始化与熔断状态汇总。200 表示进程存活。
      responses:
        "200":
          description: 引擎健康快照
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  engines:
                    type: array
                    items:
                      type: object
                      properties:
                        engine:
                          type: string
                          example: baidu
                        status:
                          type: string
                          example: ready
                        available:
                          type: boolean
        "500":
          description: 服务端错误(数据面信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataPlaneError" }

  /ready:
    get:
      tags: [ops]
      operationId: readyCheck
      summary: 就绪检查
      description: 排水中返回 503,可挂负载均衡探针。
      responses:
        "200":
          description: 就绪
        "503":
          description: 排水中,暂不接流量

  /stats:
    get:
      tags: [ops]
      operationId: getStats
      summary: 运行统计
      description: 缓存、代理、熔断器与验证码求解器的运行时统计。
      responses:
        "200":
          description: 统计快照
          content:
            application/json:
              schema:
                type: object
                properties:
                  cache:
                    type: object
                  proxy:
                    type: object
                  circuit_breakers:
                    type: array
                    items:
                      type: object
                  captcha:
                    type: object

  /{engine}/search:
    get:
      tags: [data-plane]
      operationId: searchEngine
      summary: 单引擎 SERP 搜索(鉴权随部署方 security.data_plane_auth;不计费)
      description: |
        走浏览器渲染或 raw HTTP 管道的单引擎搜索。`engine` 取值:`baidu`、`sogou`、`so360`(亦可用 `360`)、`bing`。

        响应 `meta.engines_cooldown` 携带冷却中的引擎;该引擎请求快速失败:
        `503 {"error":"engine_cooldown","reason":"COOLDOWN","retry_after_seconds":N}` + `Retry-After`。
        鉴权随部署方 security.data_plane_auth:模板默认 true 需 X-API-Key;置 false 时免鉴权。不计费。
      security:
        - ApiKeyAuth: []
      parameters:
        - name: engine
          in: path
          required: true
          schema:
            type: string
            enum: [baidu, sogou, so360, "360", bing]
          example: baidu
        - name: text
          in: query
          required: true
          description: 搜索关键词
          schema:
            type: string
            minLength: 1
          example: golang fiber 教程
        - name: limit
          in: query
          description: 返回条数(1..100,默认 10)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: start
          in: query
          description: 翻页偏移
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: lang
          in: query
          description: 语言提示(如 EN/DE/中文引擎忽略)
          schema:
            type: string
        - name: region
          in: query
          description: 市场地区提示
          schema:
            type: string
        - name: file
          in: query
          description: 文件类型过滤(pdf/docx/…)
          schema:
            type: string
        - name: site
          in: query
          description: 站内限定(domain)
          schema:
            type: string
        - name: features
          in: query
          description: 是否解析 SERP 特性模块(默认 1)
          schema:
            type: string
            enum: ["0", "1"]
            default: "1"
        - name: resolve_urls
          in: query
          description: 是否解析引擎跳转链接为直链(默认按服务端配置)
          schema:
            type: string
      responses:
        "200":
          description: 搜索结果信封
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchEnvelope" }
        "400":
          description: 参数错误(数据面信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataPlaneError" }
              example:
                error: invalid_param
                code: 400
                reason: INVALID_PARAM
                message: limit must be between 1 and 100
                request_id: req_9f2c
                meta: {}
        "429":
          description: 引擎侧拦截/验证码(数据面信封)+ Retry-After
          headers:
            Retry-After:
              description: 建议重试等待秒数
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataPlaneError" }
              examples:
                captcha:
                  value:
                    error: captcha_detected
                    code: 429
                    reason: CAPTCHA
                    message: captcha detected
                    request_id: req_9f2c
                    meta: { engine: baidu }
        "503":
          description: 引擎冷却中(契约 A)或代理不可用
          headers:
            Retry-After:
              description: 冷却剩余秒数
              schema: { type: integer }
          content:
            application/json:
              examples:
                engine_cooldown:
                  value:
                    error: engine_cooldown
                    reason: COOLDOWN
                    retry_after_seconds: 600
                proxy_unavailable:
                  value:
                    error: proxy_unavailable
                    code: 503
                    reason: PROXY_UNAVAILABLE
                    message: proxy unavailable
                    request_id: req_9f2c
                    meta: {}

  /v1/index/check:
    get:
      tags: [data-plane]
      operationId: checkIndexSingle
      summary: 单 URL 收录判定(X-API-Key)
      description: |
        查询单个 URL 在所选引擎中的可检索性，按成功引擎扣费。
        若所选引擎全部已冷却，返回 503。其余引擎级失败记入对应单元的 `error` 字段，HTTP 状态为 200。
      security:
        - ApiKeyAuth: []
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri }
          example: https://example.com/post/123
        - name: engines
          in: query
          description: 逗号分隔引擎列表，省略时使用全部可用引擎。360 是 so360 的别名。
          schema: { type: string }
          example: baidu,bing
      responses:
        "200":
          description: 收录判定结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexCheckResponse" }
        "400":
          description: URL 或引擎参数非法。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataPlaneError" }
        "401":
          description: 缺失/无效/禁用的 key(平台信封)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "403":
          description: 调用方 IP 不在该密钥的允许范围内。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: forbidden }
        "429":
          description: 日配额超限或接口访问限流，携带 Retry-After。
          headers:
            Retry-After: { description: 重试等待秒数, schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: quota_exceeded }
        "503":
          description: 目标引擎全部处于冷却期(契约 A)+ Retry-After
          headers:
            Retry-After: { description: 冷却剩余秒数, schema: { type: integer } }
          content:
            application/json:
              example:
                error: engine_cooldown
                reason: COOLDOWN
                retry_after_seconds: 600
    post:
      tags: [data-plane]
      operationId: checkIndexBatch
      summary: 批量收录判定(X-API-Key;≤20 同步,>20 转异步任务)
      description: |
        批量检测 URL，上限由 `index_jobs.max_urls` 决定，默认 5000。省略引擎时使用所有可用引擎。
        配额按提交 URL 条数 × 计费引擎数预检。同步仅扣成功单元，未命中也计费。异步在 202 时按提交单元扣费，重复 URL 也计入。

        * `urls` ≤ 20：同一引擎按 URL 顺序逐条执行，不同引擎可并行。整批完成后一次返回 JSON，无逐条响应。
          百度默认每分钟 5 次、突发 1，20 条约需 4 分钟，实际耗时受响应和重试影响。
        * `urls` > 20 且开启 `index_jobs`:返回 **202** + `job_id`;之后用
          `GET /v1/index/check/jobs/{id}` 查进度、`/results` 取结果(可 `?format=csv`)。
        * 未开启任务队列时 > 20 返回 400 `TOO_MANY_URLS`。

        同步批次开始时若所选引擎全部已冷却，请求返回 503。若部分已冷却或批次执行中触发冷却，
        冷却期间跳过的单元在 200 响应中携带 `error.code=engine_cooldown` 和 `error.retry_after_seconds`。
        响应的 `meta.engines_cooldown` 列出仍在冷却中的引擎。
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  items: { type: string, format: uri }
                  minItems: 1
                  description: 同步阈值按原始条数判断。异步默认最多 5000 条唯一字符串，可由服务配置调整。
                  example: ["https://example.com/a", "https://example.com/b"]
                engines:
                  type: array
                  description: 省略时使用全部可用引擎。360 是 so360 的别名。
                  items: { type: string, enum: [baidu, sogou, so360, "360", bing] }
                  example: [baidu]
      responses:
        "200":
          description: 批量收录判定结果(≤20 条)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexCheckResponse" }
              example:
                id: "01a21186-3b1d-7979-92fb-436bef7e5b4f"
                created_at: "2026-11-25T07:05:39Z"
                results:
                  - url: https://example.com/post-1
                    engines:
                      baidu: { indexed: true, match: exact, matched_result_url: "https://example.com/post-1", total_results: 9, took_ms: 2393 }
                  - url: https://example.com/post-2
                    engines:
                      baidu: { indexed: false, match: none, matched_result_url: "", total_results: 8, took_ms: 12020 }
                meta: { request_id: "01a21186-3b1d-7979-92fb-436bef7e5b4f", took_ms: 14413, units: 2 }
        "202":
          description: 批量已入队(>20 条);用 job_id 轮询进度与结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexJobAccepted" }
              example:
                job_id: job_20261124T054613_379221272c
                status: queued
                total: 800
                engines: [baidu]
                created_at: "2026-11-24T05:46:13Z"
                poll_url: /web-tool/v1/index/check/jobs/job_20261124T054613_379221272c
                results_url: /web-tool/v1/index/check/jobs/job_20261124T054613_379221272c/results
                csv_url: /web-tool/v1/index/check/jobs/job_20261124T054613_379221272c/results?format=csv
                note: queued; the server drains this batch at the engine's safe pace.
        "400":
          description: 参数错误（核心信封，reason 为 EMPTY_QUERY、TOO_MANY_URLS 或 INVALID_PARAM 等）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataPlaneError" }
              example:
                error: bad_request
                code: 400
                request_id: req_9f2c
                message: "TOO_MANY_URLS: urls accepts at most 5000 entries per job, got 5001"
                reason: TOO_MANY_URLS
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "403":
          description: 调用方 IP 不在该密钥的允许范围内。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: forbidden }
        "429":
          description: 日配额超限或接口访问限流，携带 Retry-After。
          headers:
            Retry-After: { description: 重试等待秒数, schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              examples:
                quota: { value: { error: quota_exceeded, retry_after_seconds: 3600 } }
                rate: { value: { error: rate_limited, retry_after_seconds: 5 } }
        "503":
          description: 同步批次所选引擎全部在冷却，或异步队列已满、服务正在停止。
          headers:
            Retry-After: { description: 重试等待秒数, schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataPlaneError" }
              examples:
                cooldown:
                  value: { error: engine_cooldown, code: 503, reason: COOLDOWN, message: "all requested engines are in cooldown: baidu (retry after 120s)", retry_after_seconds: 120 }
                queueFull:
                  value: { error: job_queue_full, code: 503, reason: JOB_QUEUE_FULL, message: "index job queue is full; retry later", retry_after_seconds: 60 }
                draining:
                  value: { error: server_draining, code: 503, reason: SERVER_DRAINING, message: "server is shutting down; retry later", retry_after_seconds: 5 }

  /v1/index/check/jobs:
    get:
      tags: [data-plane]
      operationId: listIndexJobs
      summary: 异步收录任务列表(X-API-Key;不计费)
      description: |
        按创建时间倒序返回任务(内存中的运行任务 + 落盘的历史任务)。
        后台同一时刻只执行一个任务,其余 FIFO 排队;这里可用来确认排队位置与整体进度。
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
          description: 返回条数
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              example:
                count: 1
                jobs:
                  - job_id: job_20261124T054613_379221272c
                    status: running
                    progress: 0.66
                    total: 800
                    completed: 530
                    indexed: 210
                    not_indexed: 320
                    failed: 0
                    eta_seconds: 3240
                    interval_ms: 12000
                    engines: [baidu]
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }

  /v1/index/check/jobs/{id}:
    get:
      tags: [data-plane]
      operationId: getIndexJob
      summary: 查询异步收录任务进度(X-API-Key;不计费)
      description: |
        返回单个任务的进度与统计。`status` 取值 queued/running/waiting/done/cancelled/failed;
        `waiting` 表示引擎正在冷却,`wait_seconds` 是剩余等待时间,任务会在冷却结束后自动继续。
        `eta_seconds` 按该任务的引擎令牌间隔估算,仅供参考。
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: check_index 返回的 job_id
      responses:
        "200":
          description: 任务进度
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexJobView" }
              example:
                job_id: job_20261124T054613_379221272c
                status: running
                progress: 0.66
                total: 800
                completed: 530
                indexed: 210
                not_indexed: 320
                failed: 0
                retrying: 0
                wait_seconds: 0
                eta_seconds: 3240
                interval_ms: 12000
                engines: [baidu]
                created_at: "2026-11-24T05:46:13Z"
                updated_at: "2026-11-24T06:40:02Z"
                poll_url: /web-tool/v1/index/check/jobs/job_20261124T054613_379221272c
                results_url: /web-tool/v1/index/check/jobs/job_20261124T054613_379221272c/results
                csv_url: /web-tool/v1/index/check/jobs/job_20261124T054613_379221272c/results?format=csv
        "404":
          description: 任务不存在
          content:
            application/json:
              example: { error: not_found, code: not_found }
    delete:
      tags: [data-plane]
      operationId: cancelIndexJob
      summary: 取消异步收录任务(X-API-Key;不计费)
      description: |
        取消排队中或运行中的任务;已产出结果的条目保留可读,未执行的 URL 不再查询。
        已结束(done/cancelled/failed)的任务返回 409 conflict。
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 已取消(返回任务进度对象,status=cancelled)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexJobView" }
        "404":
          description: 任务不存在
          content:
            application/json:
              example: { error: not_found, code: not_found }
        "409":
          description: 任务已结束
          content:
            application/json:
              example: { error: conflict, code: conflict }

  /v1/index/check/jobs/{id}/results:
    get:
      tags: [data-plane]
      operationId: getIndexJobResults
      summary: 下载异步收录任务结果(X-API-Key;不计费)
      description: |
        使用提交任务时的 API Key。任务执行期间也可读取已写入的结果，顺序以写入为准。
        默认返回 JSON，`results` 行结构与同步收录接口一致。用 `offset` 和 `limit` 分页。
        `?format=csv` 直接下载 Excel 可打开的表格（UTF-8 BOM + CRLF）。
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, csv], default: json }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 结果行(JSON)或 CSV 文件
          content:
            application/json:
              example:
                job_id: job_20261124T054613_379221272c
                status: done
                total: 30
                offset: 0
                count: 1
                results:
                  - url: https://example.com/post-1
                    engines:
                      baidu: { indexed: true, match: exact, matched_result_url: https://example.com/post-1, total_results: 9, took_ms: 2393 }
            text/csv:
              schema: { type: string }
              example: |
                url,baidu_indexed,baidu_match,baidu_matched_result_url,baidu_total_results,baidu_error
                https://example.com/post-1,true,exact,https://example.com/post-1,9,
        "404":
          description: 任务不存在
          content:
            application/json:
              example: { error: not_found, code: not_found }

  /v1/quota:
    get:
      tags: [data-plane]
      operationId: getQuota
      summary: 查询当前 key 的配额与用量(X-API-Key)
      description: 返回调用密钥的当日用量、配额上限(daily_quota=0 表示不限量)与累计用量。
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: 配额对象(daily_quota=0 表示不限量)
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_id: { type: string, example: key_01H... }
                  name: { type: string, example: seo-bot }
                  daily_quota: { type: integer, example: 1000 }
                  used_today: { type: integer, example: 37 }
                  unlimited: { type: boolean, example: false }
                  used_total: { type: integer, example: 1521 }
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }

  /v1/engines:
    get:
      tags: [data-plane]
      operationId: listPublicEngines
      summary: 引擎列表与熔断状态(X-API-Key)
      description: 返回四个引擎的启用状态、端点地址与熔断器快照,供调用方预判可用性。
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: 引擎快照
          content:
            application/json:
              schema:
                type: object
                properties:
                  engines:
                    type: array
                    items:
                      type: object
                      properties:
                        engine: { type: string, example: baidu }
                        endpoint: { type: string, example: /web-tool/baidu/search }
                        enabled: { type: boolean, example: true }
                        breaker:
                          type: object
                          properties:
                            engine: { type: string }
                            state: { type: string, example: closed }
                            failure_count: { type: integer }
        "401":
          description: 平台信封 401
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }

  /mcp:
    post:
      tags: [agent-plane]
      operationId: mcpRpc
      summary: MCP streamable HTTP(JSON-RPC 2.0)
      description: |
        Model Context Protocol 入口(响应式 JSON:每条消息单独 POST,服务端回单个 JSON 对象)。

        **方法**:
        * `initialize` — 握手;服务端以支持的 legacy 版本应答(默认 `2025-06-18`),`serverInfo.name="web2api"`;
          响应头返回 `Mcp-Session-Id`(内存会话,空闲 30 分钟过期)。
        * `notifications/initialized` — 通知,回 HTTP 204(无 id)。
        * `tools/list` — 6 个工具:`web_search`、`check_indexed`、`get_index_job`、`cancel_index_job`、`get_quota`、`list_engines`。
        * `tools/call` — 结果统一 `{content:[{type:"text",text:"<JSON字符串>"}], isError}`;入参校验失败回 JSON-RPC `-32602`(HTTP 200)。
        * `ping` — 回 `{}`。

        **鉴权**:`X-API-Key`(计费)或 `Authorization: Bearer <JWT>`(管理员,不计费);JWT 必须带 sid 且持久化角色为 admin,否则 `403 {"error":"forbidden","code":"insufficient_role"}`;未授权 401 平台信封。

        **计费**:`web_search` 每次调用计 1 次;`check_indexed` = 条数×引擎数次(`>20` 条转异步任务时按提交条数计);`get_index_job`/`cancel_index_job`/`get_quota`/`list_engines` 不计费。

        **JSON-RPC 错误码**:`-32700` 解析错误(HTTP 400)、`-32600` 请求无效(不支持批量)、`-32601` 方法不存在、
        `-32602` 入参校验失败、`-32001` 会话不存在(HTTP 404)。

        **Origin 校验**:无效 Origin(非绝对 http/https URL)回 403(MCP 规范)。
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  oneOf:
                    - type: integer
                    - type: string
                  description: 通知(无 id)不回响应体
                method:
                  type: string
                  enum: [initialize, notifications/initialized, tools/list, tools/call, ping]
                params:
                  type: object
            examples:
              initialize:
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: "2025-06-18"
                    capabilities: {}
                    clientInfo: { name: my-agent, version: "1.0" }
              toolsCall:
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: tools/call
                  params:
                    name: check_indexed
                    arguments:
                      urls: ["https://example.com/a", "https://example.com/b"]
      responses:
        "200":
          description: JSON-RPC 2.0 响应(成功或 error 对象)
          headers:
            Mcp-Session-Id:
              description: initialize 时下发;后续请求原样携带
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
              examples:
                initialized:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result:
                      protocolVersion: "2025-06-18"
                      capabilities: { tools: { listChanged: false } }
                      serverInfo: { name: web2api, version: "1.0" }  # B-07 版本中性化: 示例同样不带真实版本号
                invalidParams:
                  value:
                    jsonrpc: "2.0"
                    id: 2
                    error: { code: -32602, message: "invalid params: urls accepts at most 5000 entries, got 5001" }
        "204":
          description: 通知(notifications/initialized)已受理,无响应体
        "400":
          description: JSON 解析失败或请求无效(JSON-RPC 信封)
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: null
                error: { code: -32700, message: "parse error: body is not valid JSON" }
        "401":
          description: 未授权(平台信封;X-API-Key 校验与配额预检由 AuthAny 负责)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: unauthorized }
        "403":
          description: Origin 校验失败(MCP 规范)或管理员 JWT 身份不符(code=insufficient_role)
          content:
            application/json:
              example: { error: invalid_origin }
        "404":
          description: Mcp-Session-Id 未知、已过期或归属其他身份(HTTP 404 + JSON-RPC -32001)
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: null
                error: { code: -32001, message: "session not found; send initialize again" }
        "429":
          description: 配额超限或限流(平台信封)+ Retry-After
          headers:
            Retry-After: { description: 重试等待秒数, schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformError" }
              example: { error: quota_exceeded }

    delete:
      tags: [agent-plane]
      operationId: terminateMcpSession
      summary: 关闭当前身份的 MCP 会话
      description: 使用签发会话时的 API Key 身份或管理员账号鉴权，并发送初始化返回的会话 ID。
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - in: header
          name: Mcp-Session-Id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: 会话已关闭
        "401":
          description: 未授权
        "403":
          description: Origin 校验失败
        "404":
          description: 会话未知、已过期或归属其他身份

  /openapi.yaml:
    get:
      tags: [agent-plane]
      operationId: getOpenApiSpec
      summary: 本 OpenAPI 3.1 规范(go:embed 静态资源,公开)
      description: 供 Dify/n8n/LangChain 等 OpenAPI toolkit 导入(Content-Type 为 application/yaml)。
      responses:
        "200":
          description: YAML 规范文件
          content:
            application/yaml:
              schema: { type: string }

  /llms.txt:
    get:
      tags: [agent-plane]
      operationId: getLlmsTxt
      summary: 平台简介与端点清单(llms.txt,公开)
      description: agent 友好的平台说明(Content-Type 为 text/markdown)。
      responses:
        "200":
          description: llms.txt 内容
          content:
            text/markdown:
              schema: { type: string }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 平台签发的 API 密钥(sk-w2a-…),在管理面板「API密钥」页创建;按次计费(URL 数 × 引擎数)。
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 管理员 JWT(控制台登录获得),管理员调用不计费。

  schemas:
    PlatformError:
      type: object
      description: 平台信封错误(/v1/*、/mcp)。
      properties:
        error:
          type: string
          examples: [unauthorized, forbidden, quota_exceeded, not_found, too_many_attempts, rate_limited, server_error]
        retry_after_seconds: { type: integer, minimum: 1 }
      required: [error]

    IndexJobAccepted:
      type: object
      description: >-
        POST /v1/index/check 在 urls > 20 且开启 index_jobs 时的 202 回执。任务已入队,
        服务端逐条执行，所选引擎全部冷却时等待恢复。扣费按提交单元数计算，total 是去重后的任务行数。
      properties:
        job_id: { type: string, example: job_20261124T054613_379221272c }
        status:
          type: string
          enum: [queued, running, waiting, done, cancelled, failed]
        total: { type: integer, description: 去重后的 URL 条数 }
        engines:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        poll_url: { type: string, description: 进度端点(相对路径,带部署前缀) }
        results_url: { type: string, description: 结果端点 }
        csv_url: { type: string, description: CSV 下载端点 }
        note: { type: string }
      required: [job_id, status, total]

    IndexJobView:
      type: object
      description: 异步收录任务的进度视图。
      properties:
        job_id: { type: string }
        status:
          type: string
          enum: [queued, running, waiting, done, cancelled, failed]
        progress: { type: number, description: 服务端报告的进度。可用 completed / total 计算已完成行数比例。 }
        total: { type: integer }
        completed: { type: integer, description: 已产出最终结论(含失败)的条数 }
        indexed: { type: integer }
        not_indexed: { type: integer }
        failed: { type: integer }
        retrying: { type: integer, description: 等待重试的行数 }
        wait_seconds: { type: integer, description: 正在等待的冷却剩余秒数(status=waiting 时) }
        eta_seconds: { type: integer, description: 剩余时间的粗略估计(按引擎令牌间隔) }
        interval_ms: { type: integer, description: 该任务引擎的令牌间隔(百度默认 12000) }
        engines:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, description: 任务未结束时省略。 }
        last_error: { type: string }
        poll_url: { type: string }
        results_url: { type: string }
        csv_url: { type: string }
      required: [job_id, status, total, completed]

    PlatformBadRequest:
      type: object
      description: 平台 400 信封,reason ∈ EMPTY_QUERY/TOO_MANY_URLS/INVALID_PARAM。
      properties:
        error: { type: string, example: bad_request }
        code: { type: string, example: INVALID_PARAM }
        reason: { type: string, example: INVALID_PARAM }
      required: [error]

    DataPlaneError:
      type: object
      description: 数据面信封错误(核心端点)。
      properties:
        error: { type: string, example: invalid_param }
        code: { type: integer, example: 400 }
        request_id: { type: string, example: req_9f2c }
        message: { type: string }
        reason: { type: string, example: INVALID_PARAM }
        retry_after_seconds: { type: integer, minimum: 1 }
        meta:
          type: object
          additionalProperties: true
      required: [error, code, message]

    JsonRpcResponse:
      type: object
      description: JSON-RPC 2.0 响应(result 与 error 二选一)。
      properties:
        jsonrpc: { type: string, example: "2.0" }
        id:
          oneOf: [{ type: integer }, { type: string }, { type: "null" }]
        result:
          description: |
            tools/call 的 result 统一为
            `{content:[{type:"text",text:"<JSON字符串>"}], isError:false}`;
            工具执行失败时 isError:true 且 text 为 {"error":{...}}。
        error:
          type: object
          properties:
            code: { type: integer, example: -32602 }
            message: { type: string }
            data: {}
      required: [jsonrpc, id]

    ApiKeyView:
      type: object
      properties:
        id: { type: string, example: key_01H... }
        name: { type: string, example: seo-bot }
        prefix: { type: string, example: sk-w2a-3f9c }
        status: { type: string, enum: [active, disabled] }
        daily_quota: { type: integer }
        used_today: { type: integer }
        used_total: { type: integer }
        created_at: { type: string, format: date-time }
        last_used_at:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]

    SearchResult:
      type: object
      properties:
        id: { type: string }
        rank: { type: integer, example: 1 }
        type: { type: string, example: organic }
        title: { type: string, example: Fiber 框架教程 }
        url: { type: string, example: https://example.com/post }
        display_url: { type: string }
        snippet: { type: string }
        domain: { type: string, example: example.com }
        engine: { type: string, example: baidu }

    SearchEnvelope:
      type: object
      properties:
        query:
          type: object
          properties:
            text: { type: string }
            engines_requested: { type: array, items: { type: string } }
        meta:
          type: object
          properties:
            request_id: { type: string }
            requested_at: { type: string, format: date-time }
            took_ms: { type: integer }
            engines: { type: array, items: { type: string } }
            engines_failed: { type: array, items: { type: string } }
            engines_cooldown:
              type: array
              description: 契约 A — 冷却中的引擎(meta 增强)
              items:
                type: object
                properties:
                  engine: { type: string }
                  until: { type: string, format: date-time }
                  reason: { type: string, example: COOLDOWN }
            version: { type: string, example: "2.1" }
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
        serp_features:
          type: array
          items: { type: object }
        pagination:
          type: object
          properties:
            page: { type: integer }
            has_more: { type: boolean }
            next_start: { type: integer }

    IndexCheckResponse:
      type: object
      description: /v1/index/check 的统一响应结构(控制台在线调试返回同构结果)。
      properties:
        id: { type: string, example: req_9f2c }
        created_at: { type: string, format: date-time }
        results:
          type: array
          items:
            type: object
            properties:
              url: { type: string, example: https://example.com/a }
              engines:
                type: object
                description: 每引擎判定结果:成功 {indexed,match?,matched_result_url?,…};失败 {error:{code,message}}
                additionalProperties:
                  oneOf:
                    - type: object
                      required: [indexed]
                      properties:
                        indexed: { type: boolean, example: true }
                        match: { type: string }
                        matched_result_url: { type: string }
                        total_results: { type: integer }
                        took_ms: { type: integer }
                    - type: object
                      required: [error]
                      properties:
                        error:
                          type: object
                          properties:
                            code: { type: string, example: engine_cooldown }
                            message: { type: string }
                            retry_after_seconds: { type: integer, minimum: 1 }
        meta:
          type: object
          properties:
            request_id: { type: string }
            took_ms: { type: integer }
            units: { type: integer, example: 8, description: 请求单元总数（去重 URL 数 × 引擎数），实际扣费只计成功单元。 }
            engines_cooldown:
              type: array
              description: 契约 A — 冷却中的引擎
              items:
                type: object
                properties:
                  engine: { type: string }
                  until: { type: string, format: date-time }
                  reason: { type: string }

security: []
