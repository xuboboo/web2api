name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  # Manual republish (e.g. base-image refresh without a version bump).
  # Must be dispatched FROM A TAG REF: metadata-action only derives semver
  # image tags from the git tag, so a branch dispatch is rejected below.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fail fast with a clear message instead of silently pushing a bare
  # `latest` (or nothing) when someone dispatches from a branch.
  guard-dispatch:
    if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Manual runs must be dispatched from a v*.*.* tag ref (use the 'Run workflow' ref selector). Branch refs produce no semver image tags."
          exit 1

  # Catch tag/code drift before anything is published (root.go has drifted
  # from tags before).
  verify-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check tag matches cmd/root.go version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CODE_VERSION=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' cmd/root.go)
          echo "tag=v${TAG_VERSION} code=${CODE_VERSION}"
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Git tag v${TAG_VERSION} does not match version \"${CODE_VERSION}\" in cmd/root.go. Bump cmd/root.go before tagging."
            exit 1
          fi

  # PR / main validation: build and run a single-platform container smoke test.
  # Multi-arch remains covered by tag builds; the runtime smoke catches Docker
  # health, least-privilege, and outbound CA regressions on a native runner.
  build:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build smoke-test image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: web2api:audit-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert non-root runtime and no baked state
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh web2api:audit-smoke -c '
            test "$(id -u)" != "0"
            test -z "$(find /usr/src/app/data -mindepth 1 -print -quit)"
            test ! -e /usr/src/app/secret.key
            test ! -e /usr/src/app/web2api.db
            test -s /usr/share/doc/web2api/LICENSE
          '

      - name: Run container health, security, and HTTPS smoke tests
        run: |
          set -euo pipefail
          name="web2api-audit-smoke-${GITHUB_RUN_ID}"
          volume="${name}-data"
          smoke_password=$(openssl rand -hex 32)
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null

          docker run -d --name "$name" \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount "source=$volume,target=/usr/src/app/data" \
            -p 127.0.0.1:17000:7000 \
            -e WEB2API_PLATFORM_ADMIN_PASSWORD="$smoke_password" \
            -e WEB2API_SECURITY_ADMIN_RATE_PER_IP=300 \
            -e WEB2API_SECURITY_ADMIN_RATE_PER_MINUTE=300 \
            web2api:audit-smoke serve

          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$name")
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ]; then docker logs "$name"; exit 1; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$name")" = healthy
          curl --fail --silent --show-error http://127.0.0.1:17000/web-tool/health
          docker exec "$name" /headless-shell/headless-shell --version

          inspect=$(docker inspect "$name")
          echo "$inspect" | jq -e '.[0].HostConfig.CapDrop | index("ALL") != null' >/dev/null
          echo "$inspect" | jq -e '.[0].HostConfig.SecurityOpt | any(. == "no-new-privileges:true")' >/dev/null

          # The container must trust public certificates with the shipped
          # ca-certificates bundle; this exercises the final image's CA store.
          docker exec "$name" wget --quiet --tries=2 --spider https://example.com/

          E2E_ISOLATED=1 WEB2API_ADMIN_PASSWORD="$smoke_password" node deploy/e2e.mjs http://127.0.0.1:17000

  # Publish on version tags (and manual dispatch from a tag ref).
  # No fork-secrets concern: this never runs for pull_request events.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` is applied automatically on semver tags (latest=auto).
      # Caveat: it follows the most recently pushed tag, not the highest
      # version — we only tag forward, never backport.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: xuboboo/web2api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The pinned chromedp/headless-shell digest is a multi-arch OCI index
      # (amd64 + arm64/v8), and the builder stage cross-compiles via
      # $BUILDPLATFORM, so only the small final-stage apt layer runs under QEMU.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
