<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服务状态 · Web2API</title>
<meta name="description" content="查看 Web2API 的引擎是否可用、处于冷却期或熔断状态。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23177E5B'/%3E%3Ccircle cx='27' cy='27' r='13.5' fill='%23FFFFFF'/%3E%3Cpath d='M20.5 27.5 25.5 32.5 34 22.5' fill='none' stroke='%23177E5B' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M37 37 47 47' fill='none' stroke='%23FFFFFF' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="../assets/theme-boot.js?v=20261125"></script>
<link rel="stylesheet" href="../assets/style.css?v=20261125h">
<link rel="stylesheet" href="../assets/status.css?v=20261125f">
<script src="../assets/engine-status.js?v=20261125g" defer></script>
</head>
<body class="status-page">
<a class="skip-link" href="#main">跳到主要内容</a>
<header class="status-head">
  <div class="container status-nav">
    <a class="brand" href="../" aria-label="Web2API 官网">
    <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#177E5B"/><circle cx="27" cy="27" r="13.5" fill="#FFFFFF"/><path d="M20.5 27.5 25.5 32.5 34 22.5" fill="none" stroke="#177E5B" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M37 37 47 47" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/></svg>
      <span class="brand-name">Web2API</span>
    </a>
    <nav class="status-links" aria-label="服务状态导航">
      <a class="btn btn-ghost" href="../openapi.yaml">API 文档</a>
      <a class="btn btn-secondary" href="../console/">进入控制台</a>
    </nav>
  </div>
</header>
<main class="container status-main" id="main">
  <div class="status-heading">
    <div>
      <h1>服务状态</h1>
      <p>查看此实例的引擎运行情况。页面每 10 秒刷新一次。</p>
    </div>
    <button class="btn btn-secondary" id="statusRefresh" type="button">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M4.6 9a8 8 0 0 1 13.2-3.5L20 8M4 16l2.2 2.5A8 8 0 0 0 19.4 15"/></svg>
      刷新状态
    </button>
  </div>
  <div class="status-summary" id="statusSummary" data-state="unknown">
    <span class="status-summary-dot" aria-hidden="true"></span>
    <p id="statusSummaryText" role="status">正在获取引擎状态…</p>
    <time id="statusUpdated"></time>
  </div>
  <ul class="status-list status-grid" data-engine-status aria-label="各引擎当前状态"></ul>
  <p class="status-note">分段条表示当前状态；冷却进度从本页首次观测时开始计算。单次查询结果可在 <a href="../console/">管理控制台</a>查看。</p>
</main>
</body>
</html>
